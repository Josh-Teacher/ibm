<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#287968"><title>Linguatown · A little Korean, a whole town</title>
<style>
:root{--ink:#253e39;--muted:#5e716a;--green:#287968;--paper:#fffcf3;--line:#d7dfce;--yellow:#f5cb64;--pink:#f2b4a1}*{box-sizing:border-box}body{margin:0;background:#f1f3e7;color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}button,input,select{font:inherit}button{min-height:46px;padding:10px 18px;border:1px solid var(--line);border-radius:14px;background:#fffdf7;color:var(--ink);font-weight:650;cursor:pointer;transition:transform .15s,background .15s}button:hover:not(:disabled){background:#e9f1e4;transform:translateY(-2px)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b26728;outline-offset:3px}button.primary{background:var(--green);color:white;border-color:var(--green)}button.gold{background:var(--yellow);border-color:#d6ac42}button.selected{border:2px solid var(--green);background:#dceee5}button.danger{color:#9b302c;border-color:#cb8a80}h1,h2,h3,p{margin:0 0 16px}h1{font-size:clamp(38px,7vw,76px);line-height:1.08;letter-spacing:-3px}h2{font-size:clamp(25px,4vw,36px);line-height:1.2;letter-spacing:-1px}h3{font-size:21px}small,.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;font-size:12px;font-weight:800;letter-spacing:2px;color:var(--green);margin-bottom:14px}.shell{max-width:1160px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:26px}.brand{font-weight:900;font-size:23px;letter-spacing:-1px}.brand span{background:var(--green);color:white;padding:5px 9px;border-radius:12px;margin-right:8px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 5px 0 #dce2d2}.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:36px;padding:42px}.hero p{max-width:470px}.hero-art{width:100%;max-height:410px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.menu-card{text-align:left;padding:25px;min-height:170px;border-radius:22px;display:flex;flex-direction:column;align-items:flex-start}.menu-card strong{font-size:25px}.menu-card small{font-weight:400}.symbol{font-size:33px;line-height:1.5}.stats{display:flex;gap:26px;flex-wrap:wrap;padding:24px 0}.stats strong{font-size:27px;display:block}.tag{display:inline-block;border-radius:30px;padding:5px 12px;background:#e8eddd;font-size:13px;font-weight:700}.hintbox{background:#edf1e5;border-radius:15px;padding:16px;margin:16px 0}.korean{font-size:24px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:24px 0}.word{padding:18px;background:#edf1e5;border-radius:16px}.word strong{display:block;font-size:26px}.lesson{max-width:820px;margin:auto}.choices{display:grid;gap:12px;margin:24px 0}.choices button{text-align:left;padding:17px;font-size:19px}.feedback{padding:18px;border-radius:16px;border:1px solid #94b9a1;background:#e3f0e6;margin:18px 0}.feedback.bad{background:#fff0e9;border-color:#d6927d;color:#843d29}.answer{min-height:82px;border:2px dashed #b7c7b7;border-radius:16px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tiles{display:flex;gap:9px;flex-wrap:wrap;min-height:55px}.progress{height:8px;background:#dce4d4;border-radius:8px;margin:20px 0;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}.path{position:relative;max-width:720px;height:860px;margin:0 auto;background:radial-gradient(ellipse at center,#e0edcb 0%,#f4f4e7 70%);border-radius:35px;overflow:hidden}.path svg.trail{position:absolute;width:100%;height:100%}.node{position:absolute;width:126px;min-height:62px;transform:translate(-50%,-50%);border:3px solid white;box-shadow:0 4px 0 #becbb4;background:#f4ce76;padding:5px}.node:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.04)}.node.done{background:#c6e4d4}.node.next{outline:3px dashed #287968;outline-offset:5px}.node small{display:block;font-size:11px}.walker{position:absolute;z-index:3;pointer-events:none;transform:translate(-50%,-95%);width:44px;height:60px}.avatar{width:110px;height:140px}.walker .avatar{width:44px;height:60px}.primary small{color:#e0eee5}.controls{flex-wrap:wrap}.controls>div:nth-child(2){flex:1;min-width:100px}.fields+button{margin-top:20px}.scene-wrap{position:relative;border:5px solid white;border-radius:22px;overflow:hidden;background:#e9e7d3}canvas{width:100%;height:auto;display:block;touch-action:none}.scene-label{position:absolute;top:12px;left:14px;background:#fffcf3e8;border-radius:14px;padding:7px 14px;font-weight:800}.controls{display:flex;justify-content:space-between;align-items:center;margin:16px 0;gap:12px}.dpad{display:grid;grid-template:repeat(2,48px)/repeat(3,48px);gap:5px}.dpad button{padding:0;font-size:22px;touch-action:none;user-select:none}.dpad button:first-child{grid-column:2}.dpad button:nth-child(2){grid-column:1}.interact{touch-action:none;min-height:64px}.dialog-backdrop{position:fixed;inset:0;background:#243d365c;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;backdrop-filter:blur(5px)}.dialog{background:var(--paper);padding:28px;border-radius:24px;width:min(660px,100%);max-height:90dvh;overflow:auto;box-shadow:0 20px 100px #213c3944}.dialog .choices{margin:14px 0}.dialog .choices button{font-size:18px;padding:12px}.translation{color:#496459;font-size:15px;font-weight:400;display:block;margin-top:6px}.fields{display:grid;gap:16px}.fields label:has(input[type=checkbox]){padding:12px;min-height:48px}label{display:block;font-weight:650}input,select{width:100%;min-height:48px;border:1px solid #a8b8a7;border-radius:10px;background:white;color:var(--ink);padding:10px}.cosmetics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.cosmetics button{text-align:left}.preview{display:flex;justify-content:center;align-items:center;background:#e5edda;border-radius:20px;margin:18px 0;padding:16px;gap:20px}.notice{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);max-width:90%;background:#253e39;color:white;padding:12px 20px;border-radius:14px;z-index:40}.storage{background:#fff0ce;padding:8px;text-align:center;font-size:14px}.footer{font-size:12px;margin:28px 0;color:var(--muted);text-align:center}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.bigscore{font-size:65px;font-weight:900;color:var(--green)}.badge{font-size:70px}.check{color:var(--green);font-weight:800}.inventory{font-size:14px}.large-text{font-size:19px}.reduced *{transition:none!important;animation:none!important}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}@media(max-width:650px){.shell{padding:14px}.top{margin-bottom:18px}.hero{grid-template-columns:1fr;padding:26px;gap:18px}.hero-art{max-height:240px}.grid{gap:12px}.menu-card{padding:18px;min-height:160px}.menu-card strong{font-size:21px}.card{padding:20px}.dialog{padding:20px}.stats{gap:16px}.stats strong{font-size:23px}.path{height:850px}.node{width:112px}.korean{font-size:22px}.row>button{flex-shrink:1}.scene-label{font-size:13px;padding:3px 8px;top:5px;left:5px}h1{letter-spacing:-2px}}
</style></head><body><div id="storage"></div><div id="app"></div><div id="modal"></div><div id="toast" aria-live="polite"></div>
<script>
'use strict';
// CONTENT — stable IDs are assigned once, independent of shuffled presentation.
const M=(prompt,options,answer,full,meaning,why)=>({type:'choice',prompt,options,answer,full,meaning,why});
const G=(prompt,meaning,options,answer,full,why)=>({...M(prompt,options,answer,full,meaning,why),type:'gap'});
const B=(meaning,tiles,full)=>({type:'builder',prompt:'Build the supplied model sentence.',meaning,tiles,full,why:'Arrange the supplied tiles to match this model. Other Korean word orders may also be grammatical.'});
const LESSONS=[
{title:'Introducing Yourself',words:[['학생','student'],['선생님','teacher'],['한국','Korea'],['사람','person'],['저','I / me, polite']],grammar:'이에요 / 예요',rule:'Attach 이에요 after a consonant-ending noun and 예요 after a vowel-ending noun. They express “am,” “is,” or “are” in polite everyday speech.',examples:[['학생이에요.','I am a student.'],['선생님이에요.','I am a teacher.'],['저예요.','It is me.']],support:'저는 = “As for me / I.” Its topic particle is explained in Level 2. 한국 사람 = a Korean person.',ex:[M('What does 학생 mean?',['student','teacher','person'],0,'학생','student'),M('Choose “teacher.”',['사람','선생님','한국'],1,'선생님','teacher'),G('저는 학생____.','I am a student.',['이에요','예요'],0,'저는 학생이에요.'),G('저____.','It is me.',['이에요','예요'],1,'저예요.'),B('I am Korean.',['저는','한국','사람이에요.'],'저는 한국 사람이에요.')]},
{title:'Everyday Objects',words:[['책','book'],['가방','bag'],['의자','chair'],['시계','clock / watch'],['모자','hat']],grammar:'은 / 는',rule:'These particles mark the topic. Attach 은 after a consonant and 는 after a vowel. They do not mean “am,” “is,” or “are.”',examples:[['책은','as for the book'],['의자는','as for the chair'],['이건 제 가방이에요.','This is my bag.']],support:'이거 = this thing. 이건 = shortened form of 이것은, “as for this.” 제 = my, polite.',ex:[M('What does 가방 mean?',['book','bag','hat'],1,'가방','bag'),M('Choose “chair.”',['시계','모자','의자'],2,'의자','chair'),G('책____','As for the book.',['은','는'],0,'책은.'),G('의자____','As for the chair.',['은','는'],1,'의자는.'),B('This is my hat.',['이건','제','모자예요.'],'이건 제 모자예요.')]},
{title:'Places and Locations',words:[['집','home / house'],['학교','school'],['도서관','library'],['카페','café'],['공원','park']],grammar:'Place + 에 있어요 / 없어요',rule:'Use 에 after a place to identify location. 있어요 expresses presence; 없어요 expresses absence.',examples:[['저는 집에 있어요.','I am at home.'],['저는 학교에 없어요.','I am not at school.']],support:'저는 = I (as the topic). 있어요 = am / is / are there; 없어요 = am / is / are not there.',ex:[M('What does 도서관 mean?',['school','library','park'],1,'도서관','library'),M('Choose “park.”',['공원','집','카페'],0,'공원','park'),G('저는 학교____ 있어요.','I am at school.',['에','는','예요'],0,'저는 학교에 있어요.'),M('Choose “I am not at home.”',['저는 집에 있어요.','저는 집에 없어요.'],1,'저는 집에 없어요.','I am not at home.'),B('I am at the café.',['저는','카페에','있어요.'],'저는 카페에 있어요.')]},
{title:'Daily Actions',words:[['가다','to go'],['오다','to come'],['먹다','to eat'],['읽다','to read'],['공부하다','to study']],grammar:'Polite present: 아요 / 어요',rule:'Remove 다 to find the verb stem. In regular conjugation, stems whose final vowel is ㅏ or ㅗ generally take 아요; others generally take 어요. 하다 becomes 해요. Some forms contract.',examples:[['가다 → 가요','go'],['오다 → 와요','come'],['먹다 → 먹어요','eat'],['읽다 → 읽어요','read'],['공부하다 → 공부해요','study']],support:'Learn these specific forms; you do not need to infer any unfamiliar irregular verbs. 저는 = I.',ex:[M('What does 읽다 mean?',['to come','to read','to eat'],1,'읽다','to read'),M('Choose the polite present form of 가다.',['가요','가어요','가해요'],0,'가요','go'),M('Choose the polite present form of 오다.',['오어요','와요','오해요'],1,'와요','come'),G('저는 ____.','I study.',['공부해요','공부어요','공부아요'],0,'저는 공부해요.'),B('I eat.',['저는','먹어요.'],'저는 먹어요.')]},
{title:'Food and Drinks',words:[['밥','cooked rice / meal'],['빵','bread'],['물','water'],['우유','milk'],['사과','apple']],grammar:'을 / 를',rule:'These particles mark the object of an action. Attach 을 after a consonant and 를 after a vowel.',examples:[['밥을 먹어요.','I eat rice.'],['사과를 먹어요.','I eat an apple.'],['물을 마셔요.','I drink water.']],support:'마셔요 = drink. 먹어요 = eat. 먹다 can also be used colloquially for consuming water; here we practise 마셔요 as the verb for drinking.',ex:[M('What does 우유 mean?',['water','milk','bread'],1,'우유','milk'),G('밥____ 먹어요.','I eat rice.',['을','를'],0,'밥을 먹어요.'),G('사과____ 먹어요.','I eat an apple.',['을','를'],1,'사과를 먹어요.'),M('Choose “I drink water” using the verb 마셔요.',['물을 마셔요.','물을 먹어요.','우유를 마셔요.'],0,'물을 마셔요.','I drink water.','마셔요 is the verb for drinking taught here. 물을 먹어요 can also be used colloquially; this question specifically asks for 마셔요.'),B('I eat bread.',['저는','빵을','먹어요.'],'저는 빵을 먹어요.')]},
{title:'Shopping and Requests',words:[['하나','one'],['둘','two'],['셋','three'],['개','general item counter'],['원','Korean won, currency unit']],grammar:'Noun + Quantity + 주세요',rule:'주세요 makes a polite request: “Please give me…” Before 개: 하나 → 한, 둘 → 두, 셋 → 세.',examples:[['사과 한 개 주세요.','One apple, please.'],['사과 두 개 주세요.','Two apples, please.'],['사과 세 개 주세요.','Three apples, please.']],support:'개 is not the correct counter for every object; this lesson uses apples. Prices can use Arabic numerals, such as 1,000원. Spoken Sino-Korean prices are not tested.',ex:[M('What does 둘 mean?',['one','two','three'],1,'둘','two'),M('What does 원 indicate after a price?',['Korean won','number of items','time'],0,'원','Korean won'),G('사과 ____ 개 주세요.','One apple, please.',['하나','한','둘'],1,'사과 한 개 주세요.'),G('사과 ____ 개 주세요.','Three apples, please.',['셋','세','두'],1,'사과 세 개 주세요.'),B('Two apples, please.',['사과','두','개','주세요.'],'사과 두 개 주세요.')]},
{title:'Time and Routines',words:[['아침','morning / breakfast'],['점심','lunchtime / lunch'],['저녁','evening / dinner'],['시','hour marker for clock time'],['반','half; half past in clock time']],grammar:'Time + 에',rule:'Attach 에 to a time expression to say when something happens. Clock hours use native Korean numbers: 한, 두, 세.',examples:[['아침에 공부해요.','I study in the morning.'],['한 시에 가요.','I go at one o’clock.'],['두 시 반에 가요.','I go at half past two.']],support:'시 marks a clock hour, not a duration of one hour. 한 시 = 1:00; 두 시 = 2:00; 세 시 반 = 3:30.',ex:[M('What does 저녁 mean?',['morning','evening or dinner','book'],1,'저녁','evening or dinner'),M('What time is 두 시?',['1:00','2:00','3:00'],1,'두 시','2:00'),G('아침____ 공부해요.','I study in the morning.',['에','를','예요'],0,'아침에 공부해요.'),M('What time is 세 시 반?',['2:30','3:00','3:30'],2,'세 시 반','3:30'),B('I study at one o’clock.',['저는','한','시에','공부해요.'],'저는 한 시에 공부해요.')]},
{title:'Hobbies and Wishes',words:[['영화','movie'],['음악','music'],['운동','exercise'],['보다','to watch / see'],['듣다','to listen / hear']],grammar:'Verb stem + 고 싶어요',rule:'Remove 다 and add 고 싶어요 to express “want to do.”',examples:[['영화를 보고 싶어요.','I want to watch a movie.'],['음악을 듣고 싶어요.','I want to listen to music.'],['운동하고 싶어요.','I want to exercise.']],support:'운동하다 means “to exercise.” 듣 remains 듣 before 고 in 듣고 싶어요.',ex:[M('What does 음악 mean?',['movie','music','exercise'],1,'음악','music'),M('Choose “want to watch.”',['보고 싶어요','봐고 싶어요','보다 싶어요'],0,'보고 싶어요','want to watch'),G('음악을 ____ 싶어요.','I want to listen to music.',['듣고','보고','가고'],0,'음악을 듣고 싶어요.'),M('Choose “I want to exercise.”',['운동하고 싶어요.','운동이에요.','운동이 없어요.'],0,'운동하고 싶어요.','I want to exercise.'),B('I want to watch a movie.',['저는','영화를','보고','싶어요.'],'저는 영화를 보고 싶어요.')]},
{title:'Yesterday',words:[['어제','yesterday'],['주말','weekend'],['친구','friend'],['만나다','to meet'],['쉬다','to rest']],grammar:'Polite past: 았어요 / 었어요 / 했어요',rule:'For the regular verbs used here, stems whose final vowel is ㅏ or ㅗ generally take 았어요; others generally take 었어요. 하다 becomes 했어요. Contractions may occur.',examples:[['만나다 → 만났어요','meet → met'],['쉬다 → 쉬었어요','rest → rested'],['먹다 → 먹었어요','eat → ate'],['가다 → 갔어요','go → went'],['공부하다 → 공부했어요','study → studied'],['어제 친구를 만났어요.','I met a friend yesterday.'],['어제 쉬었어요.','I rested yesterday.']],support:'어제 normally appears without the time particle 에.',ex:[M('What does 어제 mean?',['yesterday','weekend','morning'],0,'어제','yesterday'),M('Choose the past form of 만나다.',['만나요','만났어요','만나고 싶어요'],1,'만났어요','met'),G('어제 ____.','I rested yesterday.',['쉬었어요','쉬어요','쉬고 싶어요'],0,'어제 쉬었어요.'),M('Choose “I studied yesterday.”',['어제 공부했어요.','어제 공부해요.','어제 공부하고 싶어요.'],0,'어제 공부했어요.','I studied yesterday.'),B('I met a friend yesterday.',['어제','친구를','만났어요.'],'어제 친구를 만났어요.')]},
{title:'Future Plans',words:[['내일','tomorrow'],['여행','trip / travel'],['한국어','Korean language'],['하다','to do'],['사다','to buy']],grammar:'(으)ㄹ 거예요',rule:'Use this pattern for a future action or plan. After a vowel-ending stem, add ㄹ 거예요. After most consonant-ending stems, add 을 거예요. If the stem already ends in ㄹ, add 거예요 without another ㄹ.',examples:[['가다 → 갈 거예요','go → will go'],['먹다 → 먹을 거예요','eat → will eat'],['사다 → 살 거예요','buy → will buy'],['하다 → 할 거예요','do → will do'],['공부하다 → 공부할 거예요','study → will study'],['내일 여행할 거예요.','I will travel tomorrow.'],['한국어를 공부할 거예요.','I will study Korean.']],support:'여행하다 = to travel (여행 + 하다). 내일 normally appears without 에.',ex:[M('What does 내일 mean?',['yesterday','tomorrow','weekend'],1,'내일','tomorrow'),M('Choose the future form of 가다.',['갔어요','갈 거예요','가고 싶어요'],1,'갈 거예요','will go'),G('내일 빵을 ____.','I will eat bread tomorrow.',['먹을 거예요','먹었어요','먹고 싶어요'],0,'내일 빵을 먹을 거예요.'),M('Choose “I will buy a book tomorrow.”',['내일 책을 살 거예요.','어제 책을 샀어요.','내일 책을 읽을 거예요.'],0,'내일 책을 살 거예요.','I will buy a book tomorrow.','사다 means “to buy”; 살 거예요 means “will buy.”'),B('I will study Korean tomorrow.',['내일','한국어를','공부할','거예요.'],'내일 한국어를 공부할 거예요.')]}];
LESSONS.forEach((l,i)=>{l.id='L'+String(i+1).padStart(2,'0');l.ex.forEach((e,j)=>{e.id=l.id+'-E'+String(j+1).padStart(2,'0');if(e.options){e.choices=e.options.map((text,k)=>({id:e.id+'-C'+k,text}));e.correct=e.choices[e.answer].id}else{e.choices=e.tiles.map((text,k)=>({id:e.id+'-T'+k,text}));e.correct=e.choices.map(t=>t.id)}e.why=e.why||(j<2?e.full+' means “'+e.meaning+'.”':l.rule)})});
const COSMETICS=[{id:'default',name:'Everyday outfit',kind:'outfit',condition:'Available immediately'},...[2,4,6,8,10].map((n,i)=>({id:'outfit'+n,name:['School cardigan','Striped sweater','Café apron outfit','Sport jacket','Explorer outfit'][i],kind:'outfit',level:n,condition:'Complete Level '+n})),...['Apple pin','Book bag','Star hair clip','Park cap'].map((name,i)=>({id:'quest'+(i+1),name,kind:'accessory',quest:i+1,condition:'Complete '+['Mina’s Apple Request','Joon’s Library Book','Yuna’s Study Invitation','Haneul’s Park Plan'][i]}))];

const HANGUL='<h3>Letters → syllable blocks</h3><p>Korean letters combine into blocks, each representing a syllable. Read the letters within a block, then move to the next block.</p><p class="korean" lang="ko">가 = ㄱ + ㅏ · 나 = ㄴ + ㅏ<br>한 = ㅎ + ㅏ + ㄴ · 국 = ㄱ + ㅜ + ㄱ</p><h3>Basic consonants</h3><p class="korean" lang="ko">ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅅ ㅇ ㅈ ㅊ ㅋ ㅌ ㅍ ㅎ</p><h3>Basic vowels</h3><p class="korean" lang="ko">ㅏ ㅑ ㅓ ㅕ ㅗ ㅛ ㅜ ㅠ ㅡ ㅣ</p><h3>Final consonants (받침)</h3><p>A consonant at the bottom of a block is a final consonant. 학생 ends in ㅇ in 생, so use 학생이에요 and 학생은. 의자 ends in the vowel ㅏ in 자, so use 의자예요 and 의자는.</p><p>This optional reference is an introduction, not a complete Hangul course.</p>';

const SAVE_KEY='linguatown-save-v1', COLORS=['#398775','#df816b','#e6bc55','#668eb9','#9b7bb4','#657084'],SKINS=['#ffe0bd','#efc397','#dca375','#ba815a','#905b3f','#613d30'],HAIRS=['Short crop','Bob','Ponytail','Curls'];
const defaults=()=>({version:1,nickname:'',appearance:{hair:0,color:0,skin:0,outfit:'default',accessory:null},completed:[],best:{},cosmetics:['default'],completedErrands:[],active:null,prefs:{reduced:typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches,large:false}});
let storageOK=true;
function sanitize(raw){const s=defaults();if(!raw||raw.version!==1)return s;if(typeof raw.nickname==='string')s.nickname=Array.from(raw.nickname.trim()).slice(0,16).join('');s.completed=LESSONS.filter(l=>Array.isArray(raw.completed)&&raw.completed.includes(l.id)).map(l=>l.id); // repair discontinuous or malformed progression
s.completed=s.completed.filter((id,i,a)=>LESSONS.slice(0,i+1).every(l=>a.includes(l.id)));
for(const id of s.completed){const n=raw.best?.[id];s.best[id]=Number.isFinite(n)?Math.max(0,Math.min(70,Math.floor(n))):0}
s.completedErrands=[1,2,3,4].filter(id=>Array.isArray(raw.completedErrands)&&raw.completedErrands.includes(id));s.cosmetics=COSMETICS.filter(c=>c.id==='default'||c.level&&s.completed.includes(LESSONS[c.level-1].id)||c.quest&&s.completedErrands.includes(c.quest)).map(c=>c.id);
for(const k of ['hair','color','skin']){let n=raw.appearance?.[k];if(Number.isInteger(n)&&n>=0&&n<(k==='hair'?4:6))s.appearance[k]=n}for(const k of ['outfit','accessory']){const id=raw.appearance?.[k];if(COSMETICS.some(c=>c.id===id&&c.kind===k&&s.cosmetics.includes(id)))s.appearance[k]=id}
if(raw.prefs&&typeof raw.prefs==='object')for(const k of ['reduced','large'])if(typeof raw.prefs[k]==='boolean')s.prefs[k]=raw.prefs[k];
if(raw.active&&[1,2,3,4].includes(raw.active.id)&&['accepted','carrying','needsCorrection','acceptedByRecipient'].includes(raw.active.stage)){s.active={id:raw.active.id,stage:raw.active.stage,item:null,clue:typeof raw.active.clue==='string'?raw.active.clue.slice(0,1000):''};const it=raw.active.item; if(it&&validItem(s.active.id,it))s.active.item=JSON.parse(JSON.stringify(it));if(['carrying','needsCorrection'].includes(s.active.stage)&&!s.active.item)s.active.stage='accepted';if(s.active.stage==='acceptedByRecipient'&&s.active.id<3)s.active.stage='accepted'}return s}
function validItem(id,it){if(!it||typeof it!=='object')return false;return id===1?['apple','bread'].includes(it.kind)&&[1,2,3].includes(it.qty):id===2?['korean','travel'].includes(it.kind)&&[1,2].includes(it.qty):id===3?['library','park'].includes(it.place)&&['1','2','2:30'].includes(it.time):['exercise','music'].includes(it.activity)&&['morning','evening'].includes(it.time)}
function load(){try{let raw=localStorage.getItem(SAVE_KEY);return raw?sanitize(JSON.parse(raw)):defaults()}catch(e){if(e instanceof SyntaxError)return defaults();storageOK=false;return defaults()}}

function nodePos(i){return {x:[26,53,76,55,28,48,75,54,27,50][i],y:780-i*76}}
function pathD(){return LESSONS.map((l,i)=>(i?'L':'M')+nodePos(i).x+' '+nodePos(i).y).join(' ')}
function travelTo(i){if(state.travel||!unlocked(i))return;const from=state.pathAt,route=[];if(from===i)route.push(i);else for(let j=from;j!==i;){j+=i>from?1:-1;route.push(j)}state.travel={route,index:0,elapsed:0,from:nodePos(from),to:nodePos(route[0]),target:i};if(state.save.prefs.reduced){state.pathAt=i;state.travel=null;startAttempt(i)}}
function appearanceForm(first){return '<div class="preview"><div id="avatar-preview">'+avatarSVG()+'</div><div><strong>'+(first?'Meet your new self':'Your town, your style')+'</strong><p class="muted">Cosmetics change appearance only.</p></div></div><div class="fields"><label>Nickname (1–16 characters)<input id="nickname" value="'+esc(state.save.nickname)+'" autocomplete="off" aria-describedby="name-error"></label><div id="name-error" role="alert"></div>'+[['hair','Hairstyle',HAIRS],['color','Outfit colour',['Forest','Coral','Sunshine','Sky','Lilac','Slate']],['skin','Skin tone',['Light peach','Warm beige','Golden tan','Medium brown','Deep brown','Dark brown']]].map(([key,label,opts])=>'<label>'+label+'<select id="'+key+'">'+opts.map((v,i)=>'<option value="'+i+'" '+(state.save.appearance[key]===i?'selected':'')+'>'+v+'</option>').join('')+'</select></label>').join('')+'</div>'+btn(first?'Enter Linguatown →':'Save nickname & appearance',first?'finishSetup':'saveAppearance','primary')+(first?'':'<h3 style="margin-top:28px">Outfits & accessories</h3><p>One outfit and one accessory at a time.</p><div class="cosmetics">'+COSMETICS.map(c=>{let has=state.save.cosmetics.includes(c.id);return btn((has?'': '🔒 ')+c.name+'<small style="display:block">'+(has?(state.save.appearance[c.kind]===c.id?'✓ Equipped':'Available'):c.condition)+'</small>','equip:'+c.id,state.save.appearance[c.kind]===c.id?'selected':'',!has)}).join('')+btn('Remove accessory','removeAccessory')+'</div>')}
function bindAppearance(first){for(const key of ['hair','color','skin'])$(key).onchange=()=>{$('avatar-preview').innerHTML=avatarSVG({...state.save.appearance,...Object.fromEntries(['hair','color','skin'].map(k=>[k,Number($(k).value)]))})}}
function saveAppearance(first){let name=$('nickname').value.trim();if(!name||Array.from(name).length>16){$('name-error').textContent='Please enter a nickname of 1–16 characters.';$('nickname').focus();return}state.save.nickname=name;for(const k of ['hair','color','skin'])state.save.appearance[k]=Number($(k).value);save();if(first)nav('menu');else{render();notify('Your character is saved.')}}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startAttempt(index,phase='vocab'){if(!unlocked(index))return;state.attempt={level:index,index:0,hearts:3,points:0,mistakes:0,orders:LESSONS[index].ex.map(e=>shuffle(e.choices.map(c=>c.id))),selected:null,tiles:[],last:null,feedback:null,correct:false,failed:false,committed:false,rewards:[]};state.phase=phase;nav('lesson')}
function vocabHTML(l){return '<div class="vocab">'+l.words.map(([ko,en])=>'<div class="word"><strong lang="ko">'+ko+'</strong>'+en+'</div>').join('')+'</div>'}
function grammarHTML(l){return '<h3>'+l.grammar+'</h3><p>'+l.rule+'</p>'+l.examples.map(([ko,en])=>'<p><span lang="ko" class="korean">'+ko+'</span><br><span class="muted">'+en+'</span></p>').join('')+'<div class="hintbox"><strong>Supporting material</strong><p>'+l.support+'</p></div>'}
function renderLesson(){const a=state.attempt,l=LESSONS[a.level],e=l.ex[a.index];let body='<div class="lesson"><div class="row spread"><span class="eyebrow">Level '+(a.level+1)+' · '+l.title+'</span>'+btn('Exit','exitLesson')+'</div><div class="row spread"><span>Hearts: '+'♥'.repeat(a.hearts)+'♡'.repeat(3-a.hearts)+'</span><strong>Attempt: '+a.points+' points</strong></div><div class="progress"><i style="width:'+((a.index+(a.correct?1:0))/5*100)+'%"></i></div>';
if(state.phase==='vocab')return body+'<section class="card"><span class="tag">01 · Vocabulary</span><h2 style="margin-top:20px">Five words for today.</h2>'+vocabHTML(l)+btn('Next: Grammar →','grammarPhase','primary')+' '+btn('Hangul Help','ref:hangul')+'</section></div>';
if(state.phase==='grammar')return body+'<section class="card"><span class="tag">02 · Grammar</span><div style="margin-top:20px">'+grammarHTML(l)+'</div><div class="row">'+btn('Vocabulary','vocabPhase')+btn('Start exercises →','exercisePhase','primary')+btn('Hangul Help','ref:hangul')+'</div></section></div>';
body+='<div class="row">'+btn('Vocabulary','ref:vocab')+btn('Grammar','ref:grammar')+btn('Hangul Help','ref:hangul')+'</div><section class="card" style="margin-top:20px"><div class="eyebrow">Question '+(a.index+1)+' / 5 · '+(e.type==='gap'?'Fill the gap':e.type==='builder'?'Sentence builder':'Choose one')+'</div><h2>'+e.prompt+'</h2>'+(e.meaning?'<p class="muted">'+esc(e.meaning)+'</p>':'');
if(e.type==='builder'){body+='<p>Use every tile to build the supplied model sentence.</p><div class="answer" aria-label="Your sentence">'+a.tiles.map(id=>btn(esc(e.choices.find(c=>c.id===id).text),'tile:'+id,'',a.correct)).join('')+'</div><div class="tiles">'+a.orders[a.index].filter(id=>!a.tiles.includes(id)).map(id=>btn(esc(e.choices.find(c=>c.id===id).text),'tile:'+id,'',a.correct)).join('')+'</div>'+btn('Clear','clearTiles','',a.correct||a.tiles.length===0)}else body+='<div class="choices">'+a.orders[a.index].map(id=>{const c=e.choices.find(c=>c.id===id);return '<button data-act="choose:'+id+'" class="'+(a.selected===id?'selected':'')+'" aria-pressed="'+(a.selected===id)+'" '+(a.correct?'disabled':'')+'>'+esc(c.text)+'</button>'}).join('')+'</div>';
if(a.feedback)body+='<div class="feedback '+(a.correct?'':'bad')+'" role="status">'+(a.correct?'✓ Correct':'✕ Not quite')+'<p>'+esc(a.feedback)+'</p>'+(a.correct?'<span class="korean" lang="ko">'+e.full+'</span><br>'+esc(e.meaning):'')+'</div>';
return body+'<div class="row">'+btn('Submit','submit','primary',!canSubmit())+btn('Continue →','nextExercise','gold',!a.correct)+'</div></section></div>'}
function signature(){const a=state.attempt,e=LESSONS[a.level].ex[a.index];return e.type==='builder'?a.tiles.join('|'):a.selected}
function canSubmit(){const a=state.attempt;if(!a||a.correct||a.failed||a.committed)return false;const e=LESSONS[a.level].ex[a.index],s=signature();return !!s&&(e.type!=='builder'||a.tiles.length===e.choices.length)&&s!==a.last}
function submitAnswer(){if(!canSubmit())return;const a=state.attempt,e=LESSONS[a.level].ex[a.index],sig=signature(),right=e.type==='builder'?a.tiles.every((id,i)=>id===e.correct[i]):a.selected===e.correct;a.last=sig;if(right){const points=[10,7,4][Math.min(a.mistakes,2)];a.points+=points;a.correct=true;a.feedback='+'+points+' points. '+e.why}else{a.hearts--;a.mistakes++;a.feedback=e.why+' Change your answer before trying again.';if(a.hearts===0){a.failed=true;nav('results');return}}render()}
function nextExercise(){const a=state.attempt;if(!a?.correct||a.failed||a.committed)return;if(a.index===4){commitLesson();nav('results');return}a.index++;a.mistakes=0;a.selected=null;a.tiles=[];a.correct=false;a.feedback=null;a.last=null;render()}
function unlockCosmetic(id){if(state.save.cosmetics.includes(id))return false;state.save.cosmetics.push(id);return true}
function commitLesson(){const a=state.attempt;if(a.committed||a.failed||a.index!==4||!a.correct||a.hearts<1)return;a.committed=true;a.points+=20;const l=LESSONS[a.level],was=state.save.completed.includes(l.id);if(!was)state.save.completed.push(l.id);state.save.best[l.id]=Math.max(state.save.best[l.id]||0,a.points);COSMETICS.filter(c=>c.level===a.level+1).forEach(c=>{if(unlockCosmetic(c.id))a.rewards.push(c.name)});if(!was&&a.level<9)a.rewards.push('Level '+(a.level+2)+' unlocked');if(!was&&a.level===9)a.rewards.push('Linguatown Explorer badge');save()}
function renderResults(){const a=state.attempt,l=LESSONS[a.level],win=!a.failed&&a.committed;return '<div class="lesson card" style="text-align:center"><div class="badge">'+(win?(a.level===9?'🏅':'✿'):'♡')+'</div><div class="eyebrow">'+l.title+'</div><h2>'+(win?(a.level===9?'Linguatown Explorer!':'Lesson completed!'):'Try Again')+'</h2>'+(win&&a.level===9?'<p>You completed all 10 introductory lessons. Your town adventures can continue!</p>':'')+'<div class="bigscore">'+a.points+'<small style="font-size:24px"> / 70</small></div><p>'+(win?'Completed attempt · includes 20 completion points':'Unsaved attempt score · no hearts remaining')+'</p><p>Saved best: '+(state.save.best[l.id]||0)+' / 70</p>'+(!win?'<div class="feedback bad"><strong>Review the last question</strong><p>'+esc(a.feedback)+'</p><p lang="ko">'+l.ex[a.index].full+'</p><p>'+esc(l.ex[a.index].meaning)+'</p></div>':'<p>'+a.rewards.map(esc).join(' · ')+'</p>')+'<div class="row" style="justify-content:center">'+(win?btn('Explore the town','town','primary')+btn('Replay lessons','path')+(a.level<9?btn('Next level →','level:'+(a.level+1),'gold'):''):btn('Review Lesson','review','primary')+btn('Retry Exercises','retry','gold'))+btn('Main menu','menu')+'</div></div>'}

function itemLabel(id,it){if(!it)return 'Empty quest slot';if(id===1)return (it.kind==='apple'?'사과':'빵')+' '+['','한','두','세'][it.qty]+' 개 주세요.';if(id===2)return (it.kind==='korean'?'한국어 책':'여행 책')+' '+(it.qty===1?'한':'두')+' 권';if(id===3)return '내일 '+{library:'도서관',park:'공원'}[it.place]+'에서 '+{'1':'한 시','2':'두 시','2:30':'두 시 반'}[it.time]+'에 한국어를 공부할 거예요.';return '내일 '+{morning:'아침',evening:'저녁'}[it.time]+'에 공원에서 '+(it.activity==='exercise'?'운동하고 싶어요.':'음악을 듣고 싶어요.')}
function inventoryText(){const a=state.save.active;return 'Quest slot · '+(a?.item?esc(itemLabel(a.id,a.item)):a?.stage==='acceptedByRecipient'?'Invitation accepted — return to '+QUESTS[a.id-1].requester:'Empty')}
function acceptQuest(id){if(state.save.active){notify('Finish or abandon your current errand first.');return false}state.save.active={id,stage:'accepted',item:null,clue:''};save();return true}
function makeItem(id,it){const a=state.save.active;if(!a||a.id!==id||a.stage==='acceptedByRecipient'||!validItem(id,it))return false;a.item={...it};a.stage='carrying';a.clue='';save();return true}
function mismatch(id,it){if(!it)return 'You do not have a package or invitation yet.';if(id===1){if(it.kind!=='apple')return 'Mina asked for apples, but this package contains bread.';if(it.qty!==2)return 'Mina asked for two apples, but this package contains '+it.qty+'.'}if(id===2){if(it.kind!=='korean')return 'Joon needs a Korean-language study book, but this is a travel book.';if(it.qty!==1)return 'Joon asked for one book, but this loan contains two.'}if(id===3){const parts=[];if(it.place!=='library')parts.push('the library, not the park');if(it.time!=='2')parts.push('two o’clock, not '+(it.time==='1'?'one o’clock':'half past two'));if(parts.length)return 'Yuna intended '+parts.join(' and ')+'. Please ask Yuna to revise the invitation.'}if(id===4){const parts=[];if(it.activity!=='exercise')parts.push('exercise, not listening to music');if(it.time!=='morning')parts.push('the morning, not the evening');if(parts.length)return 'Haneul intended '+parts.join(' and ')+'. Please return to Haneul to revise it.'}return null}
function deliverQuest(){const a=state.save.active;if(!a?.item||!['carrying','needsCorrection'].includes(a.stage))return {ok:false,reason:'Collect or prepare the request first.'};const reason=mismatch(a.id,a.item);if(reason){a.stage='needsCorrection';a.clue=reason;save();return {ok:false,reason}}if(a.id<3){finishQuest();return {ok:true,finished:true}}a.stage='acceptedByRecipient';a.item=null;a.clue='Invitation accepted. Return to '+QUESTS[a.id-1].requester+'.';save();return {ok:true,finished:false}}
function finishQuest(){const a=state.save.active;if(!a)return false;if(a.id<3){if(!a.item||mismatch(a.id,a.item))return false}else if(a.stage!=='acceptedByRecipient')return false;const id=a.id;if(!state.save.completedErrands.includes(id))state.save.completedErrands.push(id);unlockCosmetic('quest'+id);state.save.active=null;save();return true}
function journal(){const a=state.save.active;let html='<p>One active errand · one quest slot. Errands award cosmetics, never lesson points.</p>';if(a){const q=QUESTS[a.id-1];html+='<h3>'+q.name+'</h3><p>Requester: '+q.requester+' · Recipient: '+q.recipient+'<br>'+q.route+'</p><p class="korean" lang="ko">'+q.ko+'</p><details><summary>Show Translation & Vocabulary Hint</summary><p>'+q.en+'</p><p>'+q.hint+'</p></details><div class="hintbox"><strong>Stage: '+a.stage+'</strong><p>'+inventoryText()+'</p>'+(a.clue?'<p>Conversation clue: '+esc(a.clue)+'</p>':'')+'<p>Return to Requester: '+q.requester+' ('+NPCS[q.requester].place+').</p></div>'+btn('Abandon errand','abandon','danger')}else html+='<div class="hintbox">No active request. Speak to Mina or Joon at School, Yuna at the Library, or Haneul at the Park to begin.</div>';html+='<h3 style="margin-top:20px">Town errands</h3>'+QUESTS.map(q=>'<p>'+(state.save.completedErrands.includes(q.id)?'✓ Completed':'○ Not completed')+' · '+q.name+'<br><small>'+q.route+' · Reward: '+COSMETICS.find(c=>c.quest===q.id).name+'</small></p>').join('');modal('Errand journal',html,'journal')}

function npcHome(name){const n=NPCS[name];const r=n.topics.map(t=>({ko:{study:'한국어 공부',food:'음식',books:'책',plans:'내일 계획',drink:'음료',hobbies:'취미'}[t],en:TOPICS[t].label,act:'topic:'+t}));r.push({ko:'부탁 / 심부름',en:'Requests / errand',act:'questBranch'});dialogue(name,n.greet[0],n.greet[1],'안녕하세요 = hello; 저는 = I; 예요 / 이에요 = am. 어서 오세요 / 오신 것을 환영해요 = welcome. 같이 공부해요 = let’s study together. 공원이 좋아요 = the park is nice. Menu: 한국어 공부 = Korean study; 음식 = food; 책 = books; 내일 계획 = tomorrow’s plans; 음료 = drinks; 취미 = hobbies; 부탁 / 심부름 = request / errand.',r,false)}

if(!a){dialogue(name,'지금은 부탁이 없어요.','There is no request right now. Ask Mina, Joon, Yuna or Haneul to start an errand.','지금은 = right now; 부탁 = request; 없어요 = there is not.',[{ko:'알겠어요.',en:'I understand.',act:'npcBack'}]);return}

dialogue(name,'다른 친구에게 물어보세요.','Please ask the neighbour involved in your active errand. Your journal has the original request.','다른 = other; 친구 = friend; 에게 = to; 물어보세요 = please ask.',[{ko:'알겠어요.',en:'I understand.',act:'npcBack'}])}
let draft=null;
function prepareMenu(id){const a=state.save.active;if(!a||a.id!==id||a.stage==='acceptedByRecipient')return;draft={id,...(a.item||{})};const q=QUESTS[id-1];if(id===1)dialogue(state.npc,'무엇을 드릴까요?', 'What can I get you? '+(a.item?'Choose a replacement; it will exchange your package.':''),q.hint,[{ko:'사과',en:'Apple',act:'draftKind:apple'},{ko:'빵',en:'Bread',act:'draftKind:bread'}]);if(id===2)dialogue(state.npc,'어떤 책을 빌리고 싶어요?','Which book would you like to borrow? You can exchange an existing loan.',q.hint+' 빌리고 싶어요 = want to borrow.',[{ko:'한국어 책 한 권',en:'One Korean-language study book',act:'loan:korean:1'},{ko:'여행 책 한 권',en:'One travel book',act:'loan:travel:1'},{ko:'한국어 책 두 권',en:'Two Korean-language study books',act:'loan:korean:2'}]);if(id===3)dialogue(state.npc,q.ko,q.en,q.hint,[{ko:'도서관',en:'Library',act:'draftPlace:library'},{ko:'공원',en:'Park',act:'draftPlace:park'}]);if(id===4)dialogue(state.npc,q.ko,q.en,q.hint,[{ko:'운동',en:'Exercise',act:'draftActivity:exercise'},{ko:'음악 듣기',en:'Listening to music',act:'draftActivity:music'}])}
function draftConfirm(){dialogue(state.npc,itemLabel(draft.id,draft),draftEnglish(draft),QUESTS[draft.id-1].hint,[{ko:'네, 이걸로 할게요.',en:'Yes, confirm this '+(draft.id<3?'package.':'invitation.'),act:'confirmDraft'},{ko:'다시 고를게요.',en:'I’ll choose again.',act:'reviseDraft'}])}
function draftEnglish(it){if(it.id===1)return it.qty+' '+(it.kind==='apple'?'apple(s)':'piece(s) of bread')+', please.';if(it.id===2)return it.qty+' '+(it.kind==='korean'?'Korean-language study book(s)':'travel book(s)');if(it.id===3)return 'Tomorrow, study Korean at the '+it.place+' at '+it.time+'.';return 'Tomorrow at the park: '+(it.activity==='exercise'?'exercise':'listen to music')+' in the '+it.time+'.'}
function handleDelivery(){const id=state.save.active?.id;if(!id)return;const out=deliverQuest();if(out.ok){dialogue(state.npc,'고마워요!','Thank you! '+(out.finished?'Errand complete. '+COSMETICS.find(c=>c.quest===id).name+' is available in Character.':'Invitation accepted. Return to '+QUESTS[id-1].requester+' to complete the errand.'),'고마워요 = thank you. Rewards are cosmetic only and are awarded once.',[{ko:'천만에요.',en:'You’re welcome.',act:'close'}])}else{dialogue(state.npc,'다시 확인해 주세요.','Please check again. '+out.reason,'다시 = again; 확인해 주세요 = please check. '+out.reason,[{ko:'바꿔 올게요.',en:'I’ll exchange or revise it and come back.',act:'close'}])}updateInventory()}
function updateInventory(){if(state.screen==='room'){const el=document.querySelector('.inventory');if(el)el.innerHTML=inventoryText()}}
// WORLD — logical 960 × 600, collision geometry shared by rendering and movement.
const ROOMS={School:{floor:'#ece6cf',accent:'#81a991',npcs:[{name:'Mina',x:250,y:280},{name:'Joon',x:710,y:280}],obstacles:[{x:330,y:65,w:300,h:65,type:'board'},{x:145,y:355,w:180,h:70,type:'desk'},{x:635,y:355,w:180,h:70,type:'desk'},{x:425,y:260,w:110,h:65,type:'desk'}]},Library:{floor:'#e6e5d4',accent:'#9b91ac',npcs:[{name:'Sora',x:240,y:290},{name:'Yuna',x:700,y:290}],obstacles:[{x:80,y:70,w:210,h:85,type:'shelf'},{x:355,y:70,w:250,h:85,type:'shelf'},{x:670,y:70,w:210,h:85,type:'shelf'},{x:390,y:300,w:180,h:80,type:'desk'}]},Café:{floor:'#f0dfce',accent:'#d99b82',npcs:[{name:'Bomi',x:260,y:280},{name:'Dae',x:710,y:300}],obstacles:[{x:90,y:80,w:300,h:85,type:'counter'},{x:570,y:90,w:230,h:70,type:'counter'},{x:405,y:330,w:105,h:85,type:'table'},{x:710,y:400,w:105,h:65,type:'table'}]},Park:{floor:'#d2e3b6',accent:'#79a677',npcs:[{name:'Haneul',x:260,y:270},{name:'Minho',x:710,y:300}],obstacles:[{x:90,y:80,w:90,h:110,type:'tree'},{x:780,y:80,w:90,h:110,type:'tree'},{x:400,y:200,w:155,h:100,type:'pond'},{x:170,y:390,w:160,h:45,type:'bench'},{x:650,y:415,w:160,h:45,type:'bench'}]}};
function enterRoom(name){if(!ROOMS[name])return;state.loc=name;state.player={x:480,y:490};nav('room')}
function nearest(){if(!state.loc)return null;let best=null,distance=60;for(const n of ROOMS[state.loc].npcs){let d=Math.hypot(n.x-state.player.x,n.y-state.player.y);if(d<=distance){best=n;distance=d}}return best}
function interact(){if(state.screen!=='room'||state.modal)return;const n=nearest();stop();if(n)npcHome(n.name);else notify('Move closer to a resident (within 60 units).')}
function blocked(x,y,room=ROOMS[state.loc]){const r=15;if(x<32+r||x>928-r||y<46+r||y>570-r)return true;for(const o of room.obstacles)if(x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h)return true;return room.npcs.some(n=>Math.hypot(n.x-x,n.y-y)<34)}
function move(dt){if(state.screen!=='room'||state.modal)return;const keys=new Set([...state.keys,...state.touch.values()]);let dx=(keys.has('right')?1:0)-(keys.has('left')?1:0),dy=(keys.has('down')?1:0)-(keys.has('up')?1:0);if(dx||dy){const norm=Math.hypot(dx,dy),step=160*dt;dx=dx/norm*step;dy=dy/norm*step;if(!blocked(state.player.x+dx,state.player.y))state.player.x+=dx;if(!blocked(state.player.x,state.player.y+dy))state.player.y+=dy;if(state.player.y>535&&Math.abs(state.player.x-480)<65){nav('town');return}}const n=nearest(),el=$('nearby');if(el)el.textContent=n?'Talk to '+n.name+' · E':'Walk up to a neighbour';drawRoom()}
function roundRect(ctx,x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawPerson(ctx,x,y,a,name){const skin=SKINS[a.skin],color=COLORS[a.color];ctx.save();ctx.translate(x,y);ctx.fillStyle='#24423722';ctx.beginPath();ctx.ellipse(0,9,21,8,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#465d62';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(-9,10);ctx.moveTo(7,0);ctx.lineTo(9,10);ctx.stroke();roundRect(ctx,-16,-27,32,30,8,color);if(a.outfit!=='default'){ctx.strokeStyle=a.outfit==='outfit10'?'#eac27c':'#fff3d5';ctx.lineWidth=4;ctx.beginPath();if(a.outfit==='outfit4'){ctx.moveTo(-15,-16);ctx.lineTo(15,-16);ctx.moveTo(-15,-5);ctx.lineTo(15,-5)}else if(a.outfit==='outfit6'){ctx.fillStyle='#fff0d2';ctx.fillRect(-10,-22,20,24)}else{ctx.moveTo(0,-24);ctx.lineTo(0,2)}ctx.stroke()}ctx.fillStyle=skin;ctx.beginPath();ctx.arc(0,-41,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#46362f';ctx.beginPath();ctx.arc(0,-46,19,Math.PI,Math.PI*2);ctx.fill();if(a.hair===1){ctx.fillRect(-19,-46,6,24);ctx.fillRect(13,-46,6,24)}if(a.hair===2){ctx.beginPath();ctx.ellipse(21,-40,9,17,-.3,0,Math.PI*2);ctx.fill()}if(a.hair===3){for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(-16+i*8,-57+(i%2)*3,7,0,Math.PI*2);ctx.fill()}}ctx.fillStyle='#3d302a';ctx.fillRect(-7,-43,3,3);ctx.fillRect(5,-43,3,3);ctx.strokeStyle='#985f4d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-36,4,0,Math.PI);ctx.stroke();if(a.accessory==='quest1'){ctx.fillStyle='#e3684e';ctx.beginPath();ctx.arc(9,-16,5,0,7);ctx.fill()}if(a.accessory==='quest2'){roundRect(ctx,9,-11,17,22,4,'#a47d50')}if(a.accessory==='quest3'){ctx.font='20px system-ui';ctx.fillStyle='#f6ce4e';ctx.fillText('★',9,-50)}if(a.accessory==='quest4'){roundRect(ctx,-20,-63,40,15,7,'#2d7965');ctx.fillRect(-22,-51,45,5)}ctx.font='bold 16px system-ui';ctx.textAlign='center';const width=ctx.measureText(name).width+16;roundRect(ctx,-width/2,19,width,26,9,'#fffcf3ed');ctx.fillStyle='#294d40';ctx.fillText(name,0,38);ctx.restore()}
function drawRoom(){const canvas=$('scene');if(!canvas)return;const ctx=canvas.getContext('2d'),room=ROOMS[state.loc];ctx.clearRect(0,0,960,600);ctx.fillStyle=room.accent;ctx.fillRect(0,0,960,600);roundRect(ctx,25,40,910,535,15,room.floor);ctx.strokeStyle='#ffffff45';ctx.lineWidth=2;for(let x=60;x<920;x+=60){ctx.beginPath();ctx.moveTo(x,45);ctx.lineTo(x,570);ctx.stroke()}if(state.loc==='Park'){ctx.strokeStyle='#f5ebcc';ctx.lineWidth=65;ctx.beginPath();ctx.moveTo(480,565);ctx.lineTo(480,370);ctx.lineTo(270,300);ctx.stroke()}for(const o of room.obstacles){ctx.fillStyle='#384b4220';ctx.fillRect(o.x+5,o.y+8,o.w,o.h);if(o.type==='tree'){ctx.fillStyle='#82694f';ctx.fillRect(o.x+o.w/2-8,o.y+55,16,55);ctx.fillStyle='#6c9c6c';ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y+35,o.w/2,47,0,0,7);ctx.fill()}else if(o.type==='pond'){roundRect(ctx,o.x,o.y,o.w,o.h,45,'#88bdc0');ctx.strokeStyle='#d5ece2';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(o.x+75,o.y+45,55,25,0,0,7);ctx.stroke()}else if(o.type==='board'){roundRect(ctx,o.x,o.y,o.w,o.h,5,'#527f68');ctx.fillStyle='#fff8dd';ctx.font='24px system-ui';ctx.textAlign='center';ctx.fillText('안녕하세요!  ·  Welcome',o.x+o.w/2,o.y+42)}else{roundRect(ctx,o.x,o.y,o.w,o.h,9,o.type==='shelf'?'#9c8062':o.type==='counter'?'#c88f70':'#c1a779');roundRect(ctx,o.x+7,o.y+6,o.w-14,o.h-15,6,o.type==='counter'?'#f6e6c7':'#ddc798');if(o.type==='shelf'){for(let i=0;i<Math.floor(o.w/22);i++){ctx.fillStyle=['#7e9f86','#dd8e78','#7898ae','#edce78'][i%4];ctx.fillRect(o.x+12+i*21,o.y+17,15,o.h-35)}}if(o.type==='desk'){ctx.fillStyle='#fff7df';ctx.fillRect(o.x+o.w/2-22,o.y+15,44,29);ctx.strokeStyle='#9ba78e';ctx.beginPath();ctx.moveTo(o.x+o.w/2,o.y+15);ctx.lineTo(o.x+o.w/2,o.y+44);ctx.stroke()}if(o.type==='table'){ctx.fillStyle='#fffcf3';ctx.beginPath();ctx.arc(o.x+o.w/2,o.y+o.h/2,13,0,7);ctx.fill()}}}
roundRect(ctx,413,540,134,36,10,'#287968');ctx.fillStyle='white';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText('↓ EXIT',480,565);const n=nearest();if(n){ctx.strokeStyle='#fff9d8';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(n.x,n.y,33,20,0,0,7);ctx.stroke()}const chars=room.npcs.map((n,i)=>({...n,a:{hair:(Object.keys(NPCS).indexOf(n.name))%4,color:(i+Object.keys(ROOMS).indexOf(state.loc)+1)%6,skin:(i+2)%6,outfit:'default',accessory:null}}));chars.push({name:state.save.nickname,x:state.player.x,y:state.player.y,a:state.save.appearance});chars.sort((a,b)=>a.y-b.y).forEach(c=>drawPerson(ctx,c.x,c.y,c.a,c.name))}
// INPUT & UI ROUTER
function help(){modal('Welcome to Linguatown','<p>You are a new resident. Learn beginner Korean on the lesson trail, or explore freely from the very beginning.</p><h3>Learning</h3><p>Study five words and a grammar pattern, then complete five exercises with three hearts. Submit your answer, read feedback, and press Continue. Mistakes cost one heart; references are always free. Correct answers earn 10, 7 or 4 points depending on prior mistakes, plus 20 for completion. Only your best completed score per lesson counts.</p><h3>Exploration</h3><p>Move with WASD, arrow keys, or the on-screen directional pad. Stand near a resident and press E or Interact. You may hold a touch direction while pressing Interact. Furniture and residents block movement. Use the exit or Back to Town.</p><h3>Connected errands</h3><p>Speak to Mina, Joon, Yuna or Haneul and choose Requests / errand. One request and one carried item at a time. Read clues in the journal. Wrong packages or invitations can be exchanged or revised. Return to the requester when asked. No money, time limit or lesson points are involved.</p><p>Escape closes a panel. During a lesson, Escape asks before leaving. Progress saves on this browser; unfinished lessons do not.</p>')}
function settings(){modal('Settings','<div class="fields"><label><input type="checkbox" id="reduced" style="width:auto;min-height:auto" '+(state.save.prefs.reduced?'checked':'')+'> Reduce motion</label><label><input type="checkbox" id="large" style="width:auto;min-height:auto" '+(state.save.prefs.large?'checked':'')+'> Larger interface text</label></div><p style="margin-top:18px">Progress is saved on this browser when storage is available.</p>'+btn('Reset Progress','resetAsk','danger'));$('reduced').onchange=e=>{state.save.prefs.reduced=e.target.checked;save();document.body.classList.toggle('reduced',e.target.checked)};$('large').onchange=e=>{state.save.prefs.large=e.target.checked;save();document.body.classList.toggle('large-text',e.target.checked)}}
function exitLesson(){modal('Leave this lesson?','<p>Leave this lesson? Your unfinished attempt will be lost.</p><div class="row">'+btn('Stay','close','primary')+btn('Leave','leaveLesson','danger'),'exit')}
function action(act){const [kind,value,extra]=act.split(':');switch(kind){case'menu':case'town':case'path':case'character':nav(kind);break;case'setup':modal('Meet your new self',appearanceForm(true),'setup');bindAppearance(true);break;case'finishSetup':saveAppearance(true);break;case'saveAppearance':saveAppearance(false);break;case'equip':{const c=COSMETICS.find(c=>c.id===value);if(c&&state.save.cosmetics.includes(c.id)){state.save.appearance[c.kind]=c.id;save();render()}break}case'removeAccessory':state.save.appearance.accessory=null;save();render();break;case'help':help();break;case'settings':settings();break;case'close':closeModal();break;case'resetAsk':modal('Reset all progress?','<p>This deletes your nickname, lesson scores, errands and cosmetics on this browser. This cannot be undone.</p><div class="row">'+btn('Keep my progress','close','primary')+btn('Yes, reset everything','resetConfirm','danger'));break;case'resetConfirm':state.save=defaults();state.attempt=null;save();nav('start');break;case'journal':journal();break;case'abandon':modal('Abandon this errand?','<p>Your quest item and current request will be cleared. Previously earned rewards remain unlocked.</p>'+btn('Keep errand','journal','primary')+' '+btn('Abandon','abandonConfirm','danger'));break;case'abandonConfirm':state.save.active=null;save();closeModal();render();break;case'room':enterRoom(value);break;case'interact':interact();break;
case'level':if(state.screen==='path')travelTo(Number(value));else startAttempt(Number(value));break;case'vocabPhase':state.phase='vocab';render();break;case'grammarPhase':state.phase='grammar';render();break;case'exercisePhase':state.phase='exercise';render();break;case'ref':{const l=LESSONS[state.attempt.level];modal(value==='hangul'?'Hangul Help':value==='vocab'?'Vocabulary':'Grammar',value==='hangul'?HANGUL:value==='vocab'?vocabHTML(l):grammarHTML(l));break}case'choose':if(!state.attempt.correct&&!state.attempt.failed){state.attempt.selected=value;render()}break;case'tile':{const a=state.attempt;if(a.correct||a.failed)break;const i=a.tiles.indexOf(value);if(i>=0)a.tiles.splice(i,1);else a.tiles.push(value);render();break}case'clearTiles':if(!state.attempt.correct){state.attempt.tiles=[];render()}break;case'submit':submitAnswer();break;case'nextExercise':nextExercise();break;case'review':startAttempt(state.attempt.level);break;case'retry':startAttempt(state.attempt.level,'exercise');break;case'exitLesson':exitLesson();break;case'leaveLesson':state.attempt=null;nav('menu');break;
case'translate':state.dialogue.translated=!state.dialogue.translated;drawDialogue();break;case'dialogHint':state.dialogue.hinted=!state.dialogue.hinted;drawDialogue();break;case'response':{const r=state.dialogue.responses[Number(value)];if(r)action(r.act);break}case'npcBack':npcHome(state.npc);break;case'topic':topic(value);break;case'topicReply':{const r=TOPICS[value].reply;dialogue(state.npc,r[0],r[1],r[2],[{ko:'네, 고마워요.',en:'Yes, thank you.',act:'npcBack'}]);break}case'questBranch':questBranch();break;case'accept':if(acceptQuest(Number(value)))questBranch();break;case'deliver':handleDelivery();break;case'finishQuest':{const id=state.save.active?.id;if(finishQuest()){dialogue(state.npc,'정말 고마워요!','Thank you very much! Errand complete. '+COSMETICS.find(c=>c.quest===id).name+' is available in Character.','정말 = really / very much; 고마워요 = thank you.',[{ko:'천만에요.',en:'You’re welcome.',act:'close'}]);updateInventory()}break}
case'draftKind':draft.kind=value;dialogue(state.npc,'몇 개 드릴까요?','How many would you like?',QUESTS[0].hint+' 몇 = how many.',[1,2,3].map(q=>({ko:['','한 개','두 개','세 개'][q],en:String(q),act:'draftQty:'+q})));break;case'draftQty':draft.qty=Number(value);draftConfirm();break;case'loan':draft.kind=value;draft.qty=Number(extra);draftConfirm();break;
case'draftPlace':draft.place=value;dialogue(state.npc,'몇 시에 만날까요?','At what time shall we meet?',QUESTS[2].hint+' 몇 시 = what time; 만날까요 = shall we meet.',[['1','한 시','One o’clock'],['2','두 시','Two o’clock'],['2:30','두 시 반','Half past two']].map(([id,ko,en])=>({ko,en,act:'draftTime:'+id})));break;case'draftActivity':draft.activity=value;dialogue(state.npc,'언제 만날까요?','When shall we meet?',QUESTS[3].hint+' 언제 = when; 만날까요 = shall we meet.',[{ko:'아침',en:'Morning',act:'draftTime:morning'},{ko:'저녁',en:'Evening',act:'draftTime:evening'}]);break;case'draftTime':draft.time=value+(extra?':'+extra:'');draftConfirm();break;case'reviseDraft':prepareMenu(draft.id);break;case'confirmDraft':if(draft&&makeItem(draft.id,draft)){const q=QUESTS[draft.id-1];dialogue(state.npc,'준비됐어요!','It’s ready! Take it to '+q.recipient+'. You can check your request in the journal.','준비됐어요 = it is ready; 고마워요 = thank you.',[{ko:'고마워요.',en:'Thank you.',act:'close'}]);updateInventory();draft=null}break;
}}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;if(state.travel)return;action(b.dataset.act)});
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(state.modal)closeModal();else if(state.screen==='lesson')exitLesson();return}if(state.modal){if(e.key==='Tab'){const focus=[...$('modal').querySelectorAll('button:not(:disabled),input,select,summary')];if(focus.length){const first=focus[0],last=focus[focus.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}return}if(state.screen==='room'&&!['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)){const dir=KEYMAP[e.key]||KEYMAP[e.key.toLowerCase()];if(dir){e.preventDefault();state.keys.add(dir)}if(e.key.toLowerCase()==='e'&&!e.repeat){e.preventDefault();interact()}}});
document.addEventListener('keyup',e=>{const dir=KEYMAP[e.key]||KEYMAP[e.key.toLowerCase()];if(dir)state.keys.delete(dir)});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-dir]');if(b&&state.screen==='room'&&!state.modal){e.preventDefault();b.setPointerCapture(e.pointerId);state.touch.set(e.pointerId,b.dataset.dir)}});for(const event of ['pointerup','pointercancel','lostpointercapture'])document.addEventListener(event,e=>state.touch.delete(e.pointerId));window.addEventListener('blur',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
let previous=0;function frame(now){const dt=Math.min((now-previous)/1000||0,.04);previous=now;if(state.travel&&state.screen==='path'&&!state.modal){const t=state.travel;t.elapsed+=dt;let f=Math.min(t.elapsed/.32,1);const el=$('walker');if(el){el.style.left=(t.from.x+(t.to.x-t.from.x)*f)+'%';el.style.top=(t.from.y+(t.to.y-t.from.y)*f)+'px'}if(f===1){state.pathAt=t.route[t.index];t.index++;if(t.index>=t.route.length){let target=t.target;state.travel=null;startAttempt(target)}else{t.from=t.to;t.to=nodePos(t.route[t.index]);t.elapsed=0}}}move(dt);requestAnimationFrame(frame)}
if(state.save.nickname&&typeof performance!=='undefined'&&performance.getEntriesByType('navigation')[0]?.type==='reload')state.screen='menu';
render();requestAnimationFrame(frame);
</script></body></html>
