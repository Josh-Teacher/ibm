function drawMonster(){if(monsterDead){ctx.save();ctx.globalAlpha=.25;ctx.translate(monster.x,monster.y);ctx.rotate(.9);dollBody();ctx.restore();return}ctx.save();ctx.translate(monster.x,monster.y+Math.sin(performance.now()/140)*2);let faceAngle=monster.mode==='investigate'||monster.mode==='chase'?Math.atan2(monster.ty-monster.y,monster.tx-monster.x):Math.sin(monster.phase)*.1;ctx.rotate(faceAngle*.18);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,18,28,10,0,0,7);ctx.fill();ctx.fillStyle='#6e3c65';ctx.beginPath();ctx.roundRect(-22,-1,44,36,9);ctx.fill();ctx.fillStyle='#b26d93';ctx.fillRect(-27,3,10,24);ctx.fillRect(17,3,10,24);ctx.fillStyle='#c28da5';ctx.beginPath();ctx.ellipse(0,-22,27,30,0,0,7);ctx.fill();ctx.strokeStyle='#58334f';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#ffe9a5';ctx.beginPath();ctx.ellipse(-10,-25,6,8,0,0,7);ctx.ellipse(10,-25,6,8,0,0,7);ctx.fill();ctx.fillStyle='#fa3c75';ctx.beginPath();ctx.arc(-9,-24,2.5,0,7);ctx.arc(11,-24,2.5,0,7);ctx.fill();ctx.strokeStyle='#4a2849';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-3,-13);ctx.lineTo(1,-6);ctx.lineTo(-4,-1);ctx.moveTo(8,-43);ctx.lineTo(3,-30);ctx.lineTo(13,-23);ctx.stroke();ctx.fillStyle='#f0b1ca';ctx.beginPath();ctx.arc(0,-3,6,0,Math.PI);ctx.fill();ctx.strokeStyle='#4a2849';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-3,-3);ctx.lineTo(-3,2);ctx.moveTo(2,-3);ctx.lineTo(2,2);ctx.stroke();ctx.fillStyle='#52344f';ctx.beginPath();ctx.ellipse(-9,31,6,9,0,0,7);ctx.ellipse(10,31,6,9,0,0,7);ctx.fill();if(monster.mode==='chase'){ctx.strokeStyle='#ff587e';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-20,39,Math.PI*1.1,Math.PI*1.9);ctx.stroke()}ctx.restore()}function dollBody(){ctx.fillStyle='#7e4c79';ctx.beginPath();ctx.ellipse(0,0,25,42,0,0,7);ctx.fill()}
function drawPlayer(){if(player.hidden)return;ctx.save();ctx.translate(player.x,player.y);if(player.dead){ctx.rotate(player.anim);ctx.globalAlpha=.65}let bob=player.moving?Math.sin(player.anim)*2:Math.sin(player.anim*.35)*.8;ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(0,14,13,6,0,0,7);ctx.fill();ctx.fillStyle='#3d6685';ctx.beginPath();ctx.roundRect(-10,-2+bob,20,23,6);ctx.fill();ctx.fillStyle='#e7c4a5';ctx.beginPath();ctx.arc(0,-11+bob,10,0,7);ctx.fill();ctx.fillStyle='#343048';ctx.beginPath();ctx.arc(0,-15+bob,10,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-5,-12+bob,3,3);ctx.fillRect(3,-12+bob,3,3);ctx.fillStyle='#28253b';ctx.fillRect(-7,18+bob,6,7);ctx.fillRect(2,18+bob,6,7);if(maskEquipped){ctx.fillStyle='#d7e8f5';ctx.beginPath();ctx.ellipse(0,-7+bob,8,5,0,0,7);ctx.fill();ctx.strokeStyle='#efffff';ctx.stroke()}ctx.restore()}
function drawGas(){if(!gasActive&&gasParticles.length===0)return;ctx.save();for(const p of gasParticles){ctx.globalAlpha=p.a;ctx.fillStyle='#a7e8b6';ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+Math.sin(performance.now()/280+p.x)*.13),0,7);ctx.fill()}ctx.restore()}function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#ff9fc8';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1}
function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;if(state==='playing')update(dt);drawRoom();requestAnimationFrame(loop)}requestAnimationFrame(loop);

// Dedicated touch input: hold a direction to walk, then tap INTERACT near an object.
// Pointer capture makes movement reliable when a thumb drifts while pressed.
const activeTouchPointers=new Map();
function clearTouchControls(){
  activeTouchPointers.clear();
  Object.keys(touchMove).forEach(k=>touchMove[k]=false);
  document.querySelectorAll('[data-direction]').forEach(b=>b.classList.remove('pressed'));
}
for(const button of document.querySelectorAll('[data-direction]')){
  const dir=button.dataset.direction;
  button.addEventListener('pointerdown',e=>{
    if(state!=='playing')return;
    e.preventDefault();
    activeTouchPointers.set(e.pointerId,dir);
    touchMove[dir]=true;
    button.classList.add('pressed');
    if(button.setPointerCapture)button.setPointerCapture(e.pointerId);
  });
  const stop=e=>{
    if(activeTouchPointers.get(e.pointerId)!==dir)return;
    activeTouchPointers.delete(e.pointerId);
    touchMove[dir]=Array.from(activeTouchPointers.values()).includes(dir);
    if(!touchMove[dir])button.classList.remove('pressed');
  };
  button.addEventListener('pointerup',stop);
  button.addEventListener('pointercancel',stop);
  button.addEventListener('lostpointercapture',stop);
  button.addEventListener('contextmenu',e=>e.preventDefault());
}
$('touchInteract').addEventListener('pointerdown',e=>{
  if(state!=='playing')return;
  e.preventDefault();
  if(audio&&audio.state==='suspended')audio.resume();
  interact();
});
$('touchInteract').addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('blur',()=>{clearTouchControls();Object.keys(keys).forEach(k=>keys[k]=false)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTouchControls()});
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if((e.key==='e'||e.key==='E')&&state==='playing')interact();if(e.key==='Escape'&&state==='puzzle')closeOverlay()});window.addEventListener('keyup',e=>keys[e.key]=false);canvas.addEventListener('pointerdown',()=>{if(state==='playing'&&audio&&audio.state==='suspended')audio.resume()});
// Objective reward for mask is earned once when equipped; wraps original interaction safely.
const oldInteract=interact;interact=function(){const was=maskEquipped;oldInteract();if(!was&&maskEquipped)award('mask',100)};
// Keyboard and on-screen controls work after Start Game; all game play stays in this file.
})();
