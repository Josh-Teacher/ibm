<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="same-origin">
  <title>Terra Galactic Force Terminal</title>
  <style>
    :root {
      color-scheme: dark;
      --accent: #89dce7;
      --text: #d0e1e6;
      --muted: #92afb8;
      --edge: #335965;
      --button: #142a33;
      --hover: #203e47;
      --glow: #3677aa26;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html { background: #03060e; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 72px 24px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.72;
      background: radial-gradient(ellipse at 12% 80%, #14213d 0, transparent 65%), #03060e;
      isolation: isolate;
    }
    .space-scene, .vignette {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -2;
    }
    .space-scene { transform: scale(1.08); }
    .space, .sparkles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .sparkle {
      position: absolute;
      width: 12px;
      height: 12px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, #eaf4ff 0, #adcaff70 12%, #669de630 30%, transparent 70%);
      opacity: .06;
    }
    .atmosphere { opacity: .18; }
    .motion-ready { animation: space-drift 32s ease-in-out infinite alternate; }
    .motion-ready .sparkle { animation: star-shimmer var(--period) ease-in-out var(--delay) infinite; }
    .motion-ready .atmosphere { animation: atmosphere-breathe 18s ease-in-out -6s infinite alternate; }
    .is-paused, .is-paused .sparkle, .is-paused .atmosphere { animation-play-state: paused; }
    @keyframes space-drift {
      from { transform: scale(1.08) translate(-1.6%, .8%); }
      to { transform: scale(1.10) translate(1.6%, -.8%); }
    }
    @keyframes star-shimmer {
      0%, 100% { opacity: .035; }
      50% { opacity: .25; }
    }
    @keyframes atmosphere-breathe {
      from { opacity: .10; }
      to { opacity: .27; }
    }
    .vignette {
      z-index: -1;
      background: radial-gradient(ellipse at center, #01040c38 8%, transparent 64%, #02040ba6 100%);
    }
    .terminal {
      position: relative;
      width: min(100%, 620px);
      background: linear-gradient(145deg, #141c26 0%, #0c121b 36%, #080c13 100%);
      border: 1px solid var(--accent);
      border-radius: 9px;
      box-shadow: 0 0 0 1px #e0f2ff12, 0 0 0 6px #050912c9,
        0 38px 100px 20px #000d, 0 12px 30px #000b, 0 0 85px 12px var(--glow),
        inset 0 1px 0 #eff8ff24, inset 0 -1px 0 #0009;
    }
    .terminal::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 12%;
      right: 12%;
      height: 2px;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      box-shadow: 0 -5px 26px var(--glow);
    }
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 18px;
      background: linear-gradient(180deg, #233040, #17212d);
      border-bottom: 1px solid var(--edge);
      border-radius: 8px 8px 0 0;
      box-shadow: inset 0 1px 0 #ffffff12, 0 4px 16px #0005;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: 1px;
    }
    .status-light {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }
    .connection-indicator { display: flex; align-items: center; gap: 10px; font-size: 10px; letter-spacing: .6px; }
    #connectionStatus[data-state="offline"] { color: #ffbeaa; }
    #connectionStatus[data-state="offline"] + .status-light { background: #ffb08d; box-shadow: 0 0 7px #ffb08d66; }
    .retry-link { margin-top: 12px; font-size: 11px; min-height: 40px; }
    .content { padding: 25px 30px 24px; }
    .heading {
      text-align: center;
      padding-bottom: 20px;
      margin-bottom: 24px;
      border-bottom: 1px solid #292b2e;
    }
    h1 {
      margin: 0 0 7px;
      color: var(--accent);
      font-size: 18px;
      line-height: 1.5;
      letter-spacing: .35px;
      font-weight: 500;
    }
    .access {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      letter-spacing: 1.5px;
    }
    .section-label {
      display: block;
      margin: 0 0 9px;
      color: var(--accent);
      font-size: 12px;
      line-height: 1.5;
      letter-spacing: 1.3px;
      font-weight: 400;
    }
    .story { margin: 0 0 24px; }
    .hint {
      margin-bottom: 26px;
      padding-left: 15px;
      border-left: 2px solid var(--accent);
    }
    .hint p { margin: 0; font-size: 14px; line-height: 1.75; }
    form { margin: 0; }
    .answer-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 12px; }
    .input-row { display: flex; align-items: stretch; gap: 9px; }
    input {
      flex: 1 1 0;
      min-width: 0;
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--edge);
      border-radius: 2px;
      background: #070c14;
      box-shadow: inset 0 2px 7px #0007, 0 1px 0 #ffffff07;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      line-height: 1.5;
    }
    input::placeholder { color: var(--muted); opacity: .8; }
    button { font: inherit; cursor: pointer; }
    .verify {
      min-height: 46px;
      padding: 11px 17px;
      border: 1px solid var(--accent);
      border-radius: 2px;
      background: var(--button);
      color: var(--accent);
      font-size: 12px;
      line-height: 1.5;
      letter-spacing: 1px;
    }
    .verify:hover { background: var(--hover); }
    input:focus-visible, button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }
    .feedback {
      margin-top: 17px;
      padding: 13px 15px;
      border: 1px solid var(--edge);
      border-radius: 2px;
      background: #101318;
      font-size: 14px;
      line-height: 1.75;
      overflow-wrap: anywhere;
    }
    .access-granted { color: var(--text); }
    .access-denied { color: #ffb9b3; border-color: #87524c; }
    .feedback p { margin: 0; }
    .feedback p + p { margin-top: 10px; }
    .feedback-label { color: var(--accent); font-size: 12px; letter-spacing: 1px; }
    a { color: var(--accent); text-underline-offset: 4px; }
    a:hover { text-decoration-thickness: 2px; }
    .continue { display: inline-block; padding: 5px 0; letter-spacing: .6px; }
    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 3px 18px;
      border-top: 1px solid #24272b;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }
    .music-toggle {
      min-height: 44px;
      padding: 8px 0 8px 12px;
      border: 0;
      border-radius: 2px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: .5px;
    }
    .music-toggle:hover { color: var(--accent); }
    .footer-controls { display: flex; align-items: center; gap: 14px; }
    .motion-toggle {
      min-height: 44px;
      padding: 8px 0;
      border: 0;
      border-radius: 2px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: .5px;
    }
    .motion-toggle:hover { color: var(--accent); }
    audio { display: none; }
    [hidden] { display: none !important; }
    noscript p { margin: 18px 0 0; color: #ffb9b3; font-size: 13px; }
    @media (max-width: 640px) {
      body { padding: 82px 20px; }
      .content { padding: 23px 24px; }
    }
    @media (max-width: 420px) {
      body { padding: 78px 16px; }
      .titlebar { padding: 10px 14px; }
      .content { padding: 22px 19px; }
      h1 { font-size: 16px; }
      .input-row { flex-direction: column; }
      input { flex: 0 0 auto; }
      .verify { width: 100%; }
      .bottom { padding: 7px 14px 3px; gap: 0; font-size: 10px; flex-wrap: wrap; }
      .footer-controls { flex: 1 1 100%; justify-content: space-between; }
      .music-toggle, .motion-toggle { font-size: 10px; }
    }

  
    .signin-field { margin-bottom: 17px; }
    .signin-field input, .signin-field select { display: block; width: 100%; }
    select { padding: 11px 13px; background: #101319; border: 1px solid var(--edge); border-radius: 2px; color: var(--text); font: inherit; font-size: 16px; min-height: 46px; }
    select:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .signin-submit { width: 100%; margin-top: 4px; }
    button:disabled { opacity: .55; cursor: wait; }
    .signout { min-height: 44px; padding: 8px 0; border: 0; border-radius: 2px; background: transparent; color: var(--muted); font-size: 11px; letter-spacing: .5px; }
    .signout:hover { color: var(--accent); }
    .choice-row { display: flex; gap: 12px; margin-top: 24px; }
    .choice-row button { flex: 1; }
    .message-line { font-size: 14px; line-height: 1.75; margin: 0 0 18px; }
    .TGF-id-tag, .TGF-message { color: #a0ddea; }
    .OSA-id-tag, .OSA-message { color: #f1c6a8; }
    .OSA-AI-tag, .OSA-AI-message { color: #c4b3fa; }
    .sparkle-text { display: block; color: var(--accent); text-align: center; font-size: 18px; }
    .session-note { color: var(--muted); font-size: 13px; }
    #notice { margin-top: 18px; }
    @media (max-width: 420px) { .signout { font-size: 10px; } }
    .story, .hint p { white-space: pre-line; }
    .terminal.is-briefing { width: min(100%, 800px); }
    .is-briefing .content { padding: 26px 34px; }
    .briefing-kicker { margin: 0 0 12px; color: var(--muted); font-size: 11px; letter-spacing: 1px; }
    .briefing-reader { position: relative; height: min(46svh, 420px); min-height: 220px; max-height: 52svh; overflow-y: auto; scrollbar-color: var(--edge) transparent; padding-right: 12px; }
    .briefing-reader p { margin: 0 0 19px; font-size: 15px; line-height: 1.85; }
    .briefing-reader:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .reading-status { color: var(--muted); font-size: 11px; margin: 14px 0; min-height: 20px; }
    .briefing-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
    .briefing-actions .verify { flex: 1 1 200px; }
    .footer-controls { flex-wrap: wrap; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .resource-link { margin: 0 0 24px; }
    @media (max-width: 640px) { .is-briefing .content { padding: 22px; } .briefing-reader { max-height: 56svh; } }



    .terminal.is-system-files { width: min(100%, 800px); }
    .file-console { min-height: 310px; color: var(--text); padding: 5px 0 18px; }
    .file-menu { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 20px; font: inherit; font-size: 14px; line-height: 2; min-height: 140px; }
    #filePrompt { display: flex; align-items: center; gap: 12px; }
    .console-label { color: var(--accent); font-size: 14px; }
    .console-entry { display: inline-flex; align-items: center; }
    #fileNumber { width: 1.1ch; min-width: 1.1ch; flex: none; border: 0; box-shadow: none; padding: 0; background: transparent; caret-color: transparent; outline: none; }
    #fileNumber:placeholder-shown { width: 0; }
    #filePrompt:focus-within { outline: 1px solid var(--edge); outline-offset: 9px; }
    .console-cursor, .is-typing .typing-active::after { display: inline-block; content: ''; width: .6em; height: 1.1em; background: var(--accent); vertical-align: -.15em; animation: prompt-blink 1.1s steps(1) infinite; }
    @keyframes prompt-blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    #typingCopy p:empty { display: none; }
    .system-file-frame { width: 100%; height: 55svh; min-height: 320px; border: 1px solid var(--edge); background: #07101b; }
    .directive { margin-bottom: 26px; padding-left: 15px; border-left: 2px solid var(--accent); }
    .directive p { white-space: pre-line; margin: 0; font-size: 14px; }
    .transit-flow { opacity: 1; }
    .transit-scene .sparkles { opacity: 0; }
    .transit-scene #space { opacity: .18; }
    .space-scene.transit-scene { animation-name: none; transform: none; }
    @media (prefers-reduced-motion: reduce) { .console-cursor, .is-typing .typing-active::after { animation: none; } }

</style>
</head>

/* The visible terminal runs on GitHub. Only this inert connection frame runs on Google. */
function createDataDetectivesConnection(config) {
  'use strict';
  const protocol = 'dd-bridge-v1';
  const apiVersion = 4;
  const arity = { signOn: 3, getCurrent: 1, verifyCurrent: 4, chooseOutcome: 4, closeTransmission: 3, signOut: 1, getSystemFiles: 1, getSystemFile: 2, advanceOpening: 4 };
  let current = null;
  function connectionError(code, message) {

    error.code = code;

    window.crypto.getRandomValues(bytes);
    return Array.from(bytes, value => value.toString(16).padStart(2, '0')).join('');
  }
  function googleOrigin(origin) {
    try {
      const url = new URL(origin);
      return url.protocol === 'https:' && !url.port && (url.hostname === 'script.google.com' ||
        url.hostname === 'script.googleusercontent.com' || url.hostname.endsWith('-script.googleusercontent.com'));
    } catch (_) { return false; }
  }
  function belongsToFrame(root, source, depth = 0) {
    if (!root || !source) return false;
    if (root === source) return true;
    if (depth >= 4) return false;
    try {
      // Cross-origin Window.length and indexed child frames are readable; their document contents are not.
      for (let index = 0; index < Math.min(root.length, 8); index++) {
        if (belongsToFrame(root[index], source, depth + 1)) return true;
      }
    } catch (_) { return false; }
    return false;
  }
  function disconnect(error) {
    const state = current;
    if (!state) return;
    current = null;
    window.clearTimeout(state.timer);
    window.removeEventListener('message', state.receive);
    state.frame.remove();
    if (!state.ready) state.reject(error);
    for (const request of state.pending.values()) {
      window.clearTimeout(request.timer);
      request.reject(error);
    }
    state.pending.clear();
  }
  function connect() {
    if (current) return current.promise;
    if (window.location.origin !== config.clientOrigin || window.top !== window) {
      return Promise.reject(connectionError('PUBLIC_URL_REQUIRED', 'Open the terminal directly at josh-teacher.github.io/ibm/da/dd/'));
    }
    let url, channel;
    try {
      url = new URL(config.appUrl);
      if (url.protocol !== 'https:' || url.hostname !== 'script.google.com' || !url.pathname.endsWith('/exec')) throw new Error();
      channel = randomId();
    } catch (_) { return Promise.reject(connectionError('CONFIGURATION', 'Terminal connection is not configured. Please contact your instructor.')); }
    const frame = document.createElement('iframe');
    frame.hidden = true;
    frame.title = 'Data Detectives server connection';
    frame.tabIndex = -1;
    frame.setAttribute('aria-hidden', 'true');
    // The server connection cannot navigate the GitHub tab or open authorization popups.
    frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
    const state = { frame: frame, channel: channel, ready: false, pending: new Map(), remote: null, origin: '', timer: null };
    state.promise = new Promise((resolve, reject) => { state.resolve = resolve; state.reject = reject; });
    state.receive = event => {
      const message = event.data;
      if (current !== state || !message || typeof message !== 'object' || message.protocol !== protocol ||
          message.channel !== channel || !googleOrigin(event.origin) || !belongsToFrame(frame.contentWindow, event.source)) return;
      if (state.remote && (event.source !== state.remote || event.origin !== state.origin)) return;
      if (message.kind === 'ready') {
        const boot = message.boot;
        if (!boot || boot.apiVersion !== apiVersion) {
          disconnect(connectionError('UPDATE_REQUIRED', 'The terminal server needs an update. Please contact your instructor.'));
          return;
        }
        if (!boot || !Array.isArray(boot.classes) || !boot.classes.length || boot.classes.length > 20 ||
            boot.classes.some(option => !option || typeof option.key !== 'string' || typeof option.label !== 'string') ||
            !boot.theme || !boot.scene || typeof boot.ready !== 'boolean') return;

          disconnect(connectionError('SETUP_REQUIRED', 'Terminal setup is incomplete. Please contact your instructor.'));
          return;
        }
        state.remote = event.source;
        state.origin = event.origin;
        state.remote.postMessage({ protocol: protocol, channel: channel, kind: 'ack' }, state.origin);

          window.clearTimeout(state.timer);
          state.resolve(boot);
        }
        return;
      }

      const request = state.pending.get(message.id);
      if (!request) return;
      state.pending.delete(message.id);
      window.clearTimeout(request.timer);
      request.resolve(message.reply);
    };

    window.addEventListener('message', state.receive);
    frame.addEventListener('error', () => {
      if (current === state) disconnect(connectionError('CONNECTION_FAILED', 'Cannot reach the terminal server. Check your connection or contact your instructor.'));
    });

      if (current === state) disconnect(connectionError('CONNECTION_TIMEOUT', 'The terminal server did not connect. Retry; if it persists, contact your instructor.'));
    }, 20000);

        if (current === state) disconnect(connectionError('REQUEST_TIMEOUT', 'The server did not respond. Reconnect to check your saved progress.'));
      }, 45000);

      try {
        // Passwords, tokens and answers go only to the verified Google frame, never a wildcard origin.
        state.remote.postMessage({ protocol: protocol, channel: state.channel, kind: 'request', id: id, method: method, args: args }, state.origin);
      } catch (_) { disconnect(new Error('Terminal connection interrupted. Please reconnect.')); }
    });

  return Object.freeze({ connect: connect, call: call });

      async function returnFromSystemFiles() {
        stopSystemFiles(); systemConsole = null; currentTicket = '';
        terminal.classList.remove('is-system-files');
        await refreshCurrent();
      }
      systemFilesButton.addEventListener('click', openSystemFiles);

      function escapeText(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
      }
      function savedSession(value) {
        try {
          if (value === undefined) return sessionStorage.getItem(SESSION_KEY) || '';
          if (value) sessionStorage.setItem(SESSION_KEY, value); else sessionStorage.removeItem(SESSION_KEY);
        } catch (_) { /* Storage may be unavailable in an embedded browser. */ }
        return '';
      }
      function showNotice(message, denied = false) {
        notice.hidden = !message;
        notice.className = denied ? 'feedback access-denied' : 'feedback';
        notice.textContent = message || '';
      }
      function setLinkStatus(text, offline = false) {
        linkStatus.textContent = text;
        linkStatus.setAttribute('data-state', offline ? 'offline' : 'online');
        linkStatus.title = 'Client ' + CLIENT_BUILD + '; server ' + (BOOT.build || 'not connected');
      }
      function showFailure(error) {
        const ordinary = ['DENIED', 'LOGIN_LIMIT', 'LOGIN_REQUIRED', 'INVALID_INPUT', 'INVALID_ACTION', 'BUSY'].includes(error.code);
        if (!ordinary) {
          setLinkStatus(error.code === 'SETUP_REQUIRED' ? 'SETUP REQUIRED' : 'LINK UNAVAILABLE', true);
          retryConnection.hidden = Boolean(sessionToken);
          console.warn('Data Detectives ' + CLIENT_BUILD + ': ' + (error.code || 'CONNECTION_FAILED') + '. ' + error.message);
        }
        showNotice(error.message, true);
      }
      async function probeConnection() {
        const mine = generation;
        setLinkStatus('CONNECTING');
        retryConnection.hidden = true;
        try {
          const boot = REMOTE ? await REMOTE.connect() : BOOT;
          if (boot.apiVersion !== 4) { const error = new Error('Update the terminal client and Apps Script deployment together. [UPDATE_REQUIRED]'); error.code = 'UPDATE_REQUIRED'; throw error; }
          if (!boot.ready) {
            const error = new Error('Terminal setup is incomplete. Please contact your instructor. [SETUP_REQUIRED]');
            error.code = 'SETUP_REQUIRED';
            throw error;
          }
          Object.assign(BOOT, boot);
          setLinkStatus('LINK READY');
          if (!sessionToken && mine === generation) {
            const select = content.querySelector('#classKey');
            if (select) {
              const selected = select.value;
              select.innerHTML = '<option value="" disabled selected>Select your class...</option>' +
                BOOT.classes.map(option => `<option value="${escapeText(option.key)}">${escapeText(option.label)}</option>`).join('');
              if (BOOT.classes.some(option => option.key === selected)) select.value = selected;
            }
            setTheme(BOOT.theme);
            setBackdrop(BOOT.scene);
            showNotice('');
          }
        } catch (error) { if (!sessionToken && mine === generation) showFailure(error); }
      }
      function setBusy(value) {
        busy = value;
        content.querySelectorAll('input, select, button').forEach(control => { control.disabled = value; });
        signOutButton.disabled = value;
        retryConnection.disabled = value;
        systemFilesButton.disabled = value;
      }
      function setTheme(theme) {
        ['accent', 'text', 'muted', 'edge', 'button', 'hover', 'glow'].forEach(key => {
          if (/^#[0-9a-f]{6}([0-9a-f]{2})?$/i.test(theme[key] || '')) document.documentElement.style.setProperty('--' + key, theme[key]);
        });
      }
      function rpc(method, ...args) {
        if (PREVIEW) return Promise.reject(new Error('Design preview — sign-on is inactive.'));
        return REMOTE.call(method, args);
      }
      function checkReply(reply) {
        if (reply && (reply.ok || ['DENIED', 'LOGIN_LIMIT', 'LOGIN_REQUIRED', 'INVALID_INPUT', 'INVALID_ACTION', 'BUSY'].includes(reply.code))) {
          setLinkStatus('LINK READY');
          retryConnection.hidden = true;
        }
        if (!reply || !reply.ok) {
          const error = new Error(reply && reply.message || 'Terminal connection unavailable.');
          error.code = reply && reply.code || 'UNAVAILABLE';
          throw error;
        }
        return reply;
      }
      function requestId() {
        if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
        return Date.now().toString(16) + '-' + Math.random().toString(16).slice(2) + Math.random().toString(16).slice(2);
      }
      function safeHttpsUrl(value, hostname = '') {
        if (typeof value !== 'string' || !value) return '';
        try {
          const url = new URL(value);
          if (url.protocol !== 'https:' || url.username || url.password) return '';
          if (hostname && (url.hostname !== hostname || url.port)) return '';
          return url.href;
        } catch (_) { return ''; }
      }
      function resetAudio(url) {
        const safeUrl = safeHttpsUrl(url);
        if (safeUrl !== currentAudio) {
          music.pause();
          if (safeUrl) music.src = safeUrl; else music.removeAttribute('src');
          currentAudio = safeUrl;
          musicButton.textContent = 'SOUND OFF';
          musicButton.setAttribute('aria-pressed', 'false');
        }
        musicButton.hidden = !safeUrl;
      }
      function answerForm(label, placeholder) {
        return `<form id="answerForm" data-action="verify" onsubmit="return false" method="post"><label class="answer-label" for="answer">${escapeText(label)}</label><div class="input-row"><input id="answer" name="answer" type="text" maxlength="512" autocomplete="off" autocapitalize="off" spellcheck="false" required placeholder="${escapeText(placeholder)}"><button class="verify" type="submit">VERIFY</button></div></form>`;
      }
      function showSignOn(message = '') {
        stopOpeningText(); openingView = null; openingReadPosition = { key: '', index: 0 };
        stopSystemFiles(); systemConsole = null; terminal.classList.remove('is-briefing', 'is-system-files'); systemFilesButton.hidden = true;
        generation++;
        busy = false;
        signOutButton.disabled = false;
        currentTicket = '';
        draft = null;
        title.textContent = 'Terra Galactic Force Terminal';
        access.textContent = 'SIGN-ON REQUIRED';
        setTheme(BOOT.theme);
        setBackdrop(BOOT.scene);
        resetAudio('');
        signOutButton.hidden = true;
        retryConnection.hidden = true;
        content.innerHTML = `<p class="story">Enter your Gradeviewer credentials to establish a terminal session.</p>
          <form id="signOnForm" data-action="signOn" onsubmit="return false" method="post">
            <div class="signin-field"><label class="answer-label" for="classKey">Class</label><select id="classKey" name="classKey" required><option value="" disabled selected>Select your class...</option>${BOOT.classes.map(option => `<option value="${escapeText(option.key)}">${escapeText(option.label)}</option>`).join('')}</select></div>
            <div class="signin-field"><label class="answer-label" for="studentId">Student ID</label><input id="studentId" name="studentId" type="text" maxlength="64" autocomplete="username" required></div>
            <div class="signin-field"><label class="answer-label" for="password">Password</label><input id="password" name="password" type="password" maxlength="256" autocomplete="current-password" required></div>
            <button class="verify signin-submit" type="submit">SIGN ON</button>
          </form>`;
        showNotice(message || (PREVIEW ? 'Design preview — sign-on is inactive.' : ''), Boolean(message));
      }
      function clearSession(message) {
        sessionToken = '';
        savedSession('');
        showSignOn(message || 'Session ended. Please sign on again.');
      }
      function applyView(view) {
        const allowed = ['systemFiles', 'opening', 'clue', 'waiting', 'decision', 'key', 'transmission', 'completeKeep', 'completeShare'];
        if (!view || !allowed.includes(view.kind) || typeof view.ticket !== 'string') throw new Error('Terminal response unavailable.');
        const same = currentTicket === view.ticket && content.childElementCount > 0 &&
          (view.kind !== 'opening' || (openingView && openingView.opening.version === view.opening.version && openingView.opening.index === view.opening.index));
        currentTicket = view.ticket;
        setLinkStatus('LINK READY');
        retryConnection.hidden = true;
        signOutButton.hidden = false;
        setTheme(view.theme);
        setBackdrop(view.scene);
        if (same && view.kind === 'opening') return;
        title.textContent = view.title || 'Terra Galactic Force Terminal';
        access.textContent = view.access || 'GENERAL ACCESS';
        resetAudio(view.audioUrl);
        if (same) return;
        if (view.kind === 'systemFiles') { renderSystemFiles(view); return; }
        if (view.kind === 'opening') { renderOpening(view); return; }
        stopOpeningText(); openingView = null; stopSystemFiles(); systemConsole = null; terminal.classList.remove('is-briefing', 'is-system-files'); systemFilesButton.hidden = false;
        if (view.kind === 'clue') {
          const assignment = view.assignment && typeof view.assignment === 'object' && safeHttpsUrl(view.assignment.url);
          content.innerHTML = `<section aria-labelledby="storyLabel"><h2 class="section-label" id="storyLabel">STORY UPDATE</h2><p class="story">${escapeText(view.story)}</p></section>` +
            `<aside class="directive" aria-labelledby="directiveLabel"><h2 class="section-label" id="directiveLabel">DIRECTIVE</h2><p>${escapeText(view.directive)}</p></aside>` +
            (assignment ? `<section class="resource-link" aria-labelledby="assignmentLabel"><h2 class="section-label" id="assignmentLabel">ASSIGNMENT</h2><a href="${escapeText(assignment)}" target="_blank" rel="noopener noreferrer">${escapeText(view.assignment.title || 'Open assignment')}</a></section>` : '') +
            (typeof view.hint === 'string' && view.hint.trim() ? `<aside class="hint" aria-labelledby="hintLabel"><h2 class="section-label" id="hintLabel">HINT</h2><p>${escapeText(view.hint)}</p></aside>` : '') +
            answerForm('Clue answer', 'Enter your finding...');
        } else if (view.kind === 'key') {
          content.innerHTML = `<p class="story">${escapeText(view.text)}</p>${answerForm('Level 2 encryption key', view.prompt)}`;
        } else if (view.kind === 'decision') {
          content.innerHTML = `<p class="story">${escapeText(view.text)}</p><div class="choice-row"><button class="verify" type="button" data-choice="KEEP">[ KEEP ]</button><button class="verify" type="button" data-choice="SHARE">[ SHARE ]</button></div>`;
        } else if (view.kind === 'transmission') {
          content.innerHTML = view.messages.map(message => `<p class="message-line">${message}</p>`).join('') + '<button class="verify" type="button" data-close-transmission>[ CLOSE SESSION ]</button>';
        } else if (view.kind === 'completeShare') {
          content.innerHTML = view.storyLines.filter(Boolean).map(line => `<p class="message-line">${line}</p>`).join('');
        } else if (view.kind === 'completeKeep') {
          const url = safeHttpsUrl(view.videoUrl, 'youtu.be');
          content.innerHTML = `<p class="story">${escapeText(view.text)}</p>${url ? `<a class="continue" href="${escapeText(url)}" target="_blank" rel="noopener noreferrer">[ OPEN TRANSMISSION ]</a>` : ''}`;
        } else content.innerHTML = `<p class="story">${escapeText(view.text)}</p>`;
        const input = content.querySelector('#answer');
        if (input && draft && draft.ticket === view.ticket) input.value = draft.answer;
        draft = null;
      }
      function showReconnect(message) {
        stopOpeningText(); openingView = null; stopSystemFiles(); systemConsole = null; terminal.classList.remove('is-briefing', 'is-system-files'); systemFilesButton.hidden = true;
        generation++;
        busy = false;
        signOutButton.disabled = false;
        currentTicket = '';
        content.innerHTML = '<p class="story">Re-establish the terminal connection to continue.</p><button class="verify" type="button" data-reconnect>RECONNECT</button>';
        showNotice(message, true);
        resetAudio('');
      }
      async function refreshCurrent(quiet = false) {
        if (!sessionToken || document.hidden || busy || PREVIEW || (quiet && (openingView || systemConsole))) return;
        if (systemConsole && !quiet) { await openSystemFiles(); return; }
        const mine = ++generation;
        setBusy(true);
        if (!quiet) showNotice('Establishing terminal connection...');
        try {
          const reply = checkReply(await rpc('getCurrent', sessionToken));
          if (mine !== generation || document.hidden) return;
          const changed = currentTicket !== reply.view.ticket;
          applyView(reply.view);
          if (!quiet || changed) showNotice('');
        } catch (error) {
          if (mine !== generation) return;
          if (error.code === 'LOGIN_REQUIRED') clearSession(error.message);
          else { showReconnect(error.message); showFailure(error); }
        } finally { if (mine === generation) setBusy(false); }
      }
      async function submitSignOn(form) {
        if (busy) return;
        const classKey = form.elements.classKey.value;
        const id = form.elements.studentId.value.trim();
        const password = form.elements.password.value;
        form.elements.password.value = '';
        if (PREVIEW) { showNotice('Design preview — sign-on is inactive.'); return; }
        const mine = ++generation;
        setBusy(true);
        showNotice('Establishing terminal session...');
        try {
          const reply = checkReply(await rpc('signOn', classKey, id, password));
          if (mine !== generation || document.hidden) return;
          sessionToken = reply.sessionToken;
          savedSession(sessionToken);
          applyView(reply.view);
          showNotice('');
        } catch (error) { if (mine === generation) showFailure(error); }
        finally { if (mine === generation) setBusy(false); }
      }
      async function performAction(method, ...details) {
        if (busy || !sessionToken || !currentTicket || document.hidden) return;
        const mine = ++generation;
        const ticket = currentTicket;
        const id = requestId();
        setBusy(true);
        showNotice('Verifying transmission...');
        try {
          const reply = checkReply(await rpc(method, sessionToken, ticket, ...details, id));
          if (mine !== generation || document.hidden) return;
          applyView(reply.view);
          showNotice(reply.message || '', reply.code === 'DENIED');
        } catch (error) {
          if (mine !== generation) return;
          if (error.code === 'LOGIN_REQUIRED') clearSession(error.message);
          else {
            showFailure(error);
            // A response may have been lost after a committed answer. Reload authoritative state.
            if (!['INVALID_INPUT', 'INVALID_ACTION', 'BUSY'].includes(error.code)) {
              setBusy(false);
              refreshCurrent();
            }
          }
        } finally { if (mine === generation) setBusy(false); }
      }
      content.addEventListener('submit', event => {
        event.preventDefault();
        const form = event.target;
        if (form.dataset.action === 'signOn') submitSignOn(form);
        else if (form.dataset.action === 'verify') performAction('verifyCurrent', form.elements.answer.value);
        else if (form.dataset.action === 'systemFile') openSystemFile(form.elements.fileNumber.value);
      });
      content.addEventListener('input', event => {
        if (event.target.id !== 'fileNumber' || !systemConsole) return;
        const value = event.target.value;
        if (!systemConsole.view.files.some(file => String(file.number) === value)) event.target.value = '';
      });
      content.addEventListener('click', event => {
        if (event.target.closest('[data-files-return]') && !busy) { returnFromSystemFiles(); return; }
        if (event.target.closest('[data-files-menu]') && !busy && systemConsole) { title.textContent = 'System files'; renderSystemFiles(systemConsole.view); return; }
        if (event.target.closest('[data-opening-next]') && openingView && !busy && openingRun && openingRun.index === openingRun.characters.length) {
          performAction('advanceOpening', openingView.opening.screens[openingView.opening.index].id); return;
        }
        const choice = event.target.closest('[data-choice]');
        if (choice) { performAction('chooseOutcome', choice.dataset.choice); return; }
        if (event.target.closest('[data-close-transmission]')) { performAction('closeTransmission'); return; }
        if (event.target.closest('[data-reconnect]')) refreshCurrent();
      });
      signOutButton.addEventListener('click', async () => {
        const previousToken = sessionToken;
        sessionToken = '';
        savedSession('');
        showSignOn();
        if (previousToken) { try { await rpc('signOut', previousToken); } catch (_) {} }
      });
      retryConnection.addEventListener('click', () => {
        if (REMOTE) probeConnection(); else window.location.reload();
      });
      musicButton.addEventListener('click', async () => {
        if (!currentAudio) return;
        if (!music.paused) { music.pause(); return; }
        try { await music.play(); }
        catch { musicButton.textContent = 'SOUND UNAVAILABLE'; }
      });
      function updateSound() {
        musicButton.textContent = music.paused ? 'SOUND OFF' : 'SOUND ON';
        musicButton.setAttribute('aria-pressed', String(!music.paused));
        musicButton.setAttribute('aria-label', music.paused ? 'Turn background music on' : 'Turn background music off');
      }
      music.addEventListener('play', updateSound);
      music.addEventListener('pause', updateSound);
      function concealProtectedView() {
        const password = content.querySelector('#password');
        if (password) password.value = '';
        if (!sessionToken) return;
        const input = content.querySelector('#answer');
        if (input) draft = { ticket: currentTicket, answer: input.value };
        stopOpeningText(); stopSystemFiles();
        generation++;
        busy = false;
        currentTicket = '';
        content.replaceChildren();
        showNotice('');
        music.pause();
      }
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) concealProtectedView(); else refreshCurrent();
      });
      window.addEventListener('pagehide', concealProtectedView);
      window.addEventListener('pageshow', event => { if (event.persisted) refreshCurrent(); });
      window.setInterval(() => { if (!document.hidden && sessionToken && !busy) refreshCurrent(true); }, 30000);
      showSignOn();
      if (PREVIEW) setLinkStatus('DESIGN PREVIEW');
      if (!PREVIEW) {
        probeConnection();
        sessionToken = savedSession();
        if (sessionToken) refreshCurrent();
      }

    })();
  </script>
</body>
</html>
